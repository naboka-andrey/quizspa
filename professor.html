<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profesor · Quizspa</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#171717;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:1200px;margin:auto;padding:24px}.head{margin-bottom:20px}h1{margin:0 0 5px;font-size:28px}.note{font-size:13px;color:#777}.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,.85fr);gap:24px;align-items:start}.box{background:#fff;border:1px solid #ddd;border-radius:20px;padding:18px;box-shadow:0 8px 25px #0000000a}h2{margin:0 0 14px;font-size:18px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.row input{width:100%;padding:12px;border:1px solid #ddd;border-radius:11px;font:inherit}.add{width:100%;border:0;border-radius:12px;background:#171717;color:#fff;padding:13px;font:600 15px system-ui;cursor:pointer;margin-top:8px}.add:disabled{opacity:.45}.msg{min-height:20px;margin-top:10px;font-size:13px}.cards{max-height:76vh;overflow:auto}.item{padding:11px 0;border-bottom:1px solid #eee;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.side{display:flex;align-items:center;gap:6px}.actions{display:flex;gap:4px}.mini{padding:5px 7px;border:1px solid #ddd;background:#fff;border-radius:8px;cursor:pointer;font-size:14px}.mini.del{color:#d7263d;border-color:#f1b9c0}.editrow{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr auto auto;gap:6px}.editrow input{min-width:0;padding:9px;border:1px solid #ccc;border-radius:9px}.save{background:#171717;color:#fff;border-color:#171717}.es{font-weight:650}.ru{font-size:13px;color:#666;margin-top:2px}.badge{font-size:12px;padding:5px 8px;border-radius:999px;background:#eee;white-space:nowrap}.badge.quizlet{background:#e8f7ed;color:#176b35}.badge.archived{background:#fff1d6;color:#8a5b00}.badge.deleted{background:#f3e8e8;color:#8b3131}.count{font-size:12px;color:#888;font-weight:400}.empty{color:#888;font-size:14px;padding:18px 0}.tools{display:flex;gap:8px;margin-bottom:12px}.tools input{flex:1;padding:10px;border:1px solid #ddd;border-radius:10px}@media(max-width:760px){.wrap{padding:14px}.grid{grid-template-columns:1fr}.cards{max-height:none}.box{padding:14px}.row{grid-template-columns:1fr 1fr}h1{font-size:24px}}@media(max-width:430px){.side{align-items:flex-end;flex-direction:column}.editrow{grid-template-columns:1fr 1fr}.row{gap:6px}.row input{padding:10px;font-size:14px}}
</style></head><body><div class="wrap"><div class="head"><h1>Profesor · Quizspa</h1><div class="note">Si dejas vacío el campo en ruso, la traducción se añadirá automáticamente.</div></div><div class="grid"><section class="box"><h2>Añadir palabras</h2><div id="rows"></div><button class="add" id="add">Añadir</button><div class="msg" id="msg"></div></section><section class="box"><h2>Palabras añadidas <span class="count" id="count"></span></h2><div class="tools"><input id="search" placeholder="Buscar…"></div><div class="cards" id="cards"></div></section></div></div><script>
const SB='https://xzcqkztdjbcwcmxzzqdz.supabase.co',KEY='sb_publishable__wRR3gtkGhgJifoQUV-l8A_LMgxkV0N',hdr={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},rows=document.querySelector('#rows'),cards=document.querySelector('#cards'),msg=document.querySelector('#msg'),btn=document.querySelector('#add');let DATA=[];
for(let i=0;i<20;i++){let r=document.createElement('div');r.className='row';r.innerHTML='<input class="sp" placeholder="Español"><input class="ru" placeholder="Ruso">';rows.appendChild(r)}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function label(s){return s==='archived'?'Archivado':s==='deleted'?'Eliminado':'En Quizlet'}
let EDIT=null;
function render(){const rank={quizlet:0,archived:1,deleted:2};DATA.sort((a,b)=>(rank[a.status]??9)-(rank[b.status]??9)||new Date(b.created_at)-new Date(a.created_at));let term=document.querySelector('#search').value.trim().toLowerCase(),a=DATA.filter(x=>!term||x.spanish.toLowerCase().includes(term)||(x.russian||'').toLowerCase().includes(term));document.querySelector('#count').textContent='('+DATA.length+')';cards.innerHTML=a.length?a.map(x=>{let editing=EDIT===x.id;return '<div class="item" data-id="'+esc(x.id)+'">'+(editing?'<div class="editrow"><input class="editsp" value="'+esc(x.spanish)+'"><input class="editru" value="'+esc(x.russian||'')+'"><button class="mini save" onclick="saveEdit(\''+esc(x.id)+'\')">Guardar</button><button class="mini" onclick="cancelEdit()">Cancelar</button></div>':'<div><div class="es">'+esc(x.spanish)+'</div><div class="ru">'+esc(x.russian||'—')+'</div></div><div class="side"><span class="badge '+x.status+'">'+label(x.status)+'</span><div class="actions"><button class="mini" title="Editar" onclick="startEdit(\''+esc(x.id)+'\')">✎</button>'+(x.status!=='deleted'?'<button class="mini" title="'+(x.status==='archived'?'Restaurar':'Archivar')+'" onclick="toggleArchive(\''+esc(x.id)+'\')">'+(x.status==='archived'?'↩️':'🗃️')+'</button><button class="mini del" title="Eliminar" onclick="removeWord(\''+esc(x.id)+'\')">×</button>':'')+'</div></div>')+'</div>'}).join(''):'<div class="empty">No hay palabras.</div>'}
function startEdit(id){EDIT=id;render()}
function cancelEdit(){EDIT=null;render()}
async function patch(id,data){let r=await fetch(SB+'/rest/v1/cards?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{...hdr,'Prefer':'return=minimal'},body:JSON.stringify(data)});if(!r.ok)throw new Error(await r.text())}
async function saveEdit(id){let el=cards.querySelector('[data-id="'+CSS.escape(id)+'"]'),spanish=el.querySelector('.editsp').value.trim(),russian=el.querySelector('.editru').value.trim();if(!spanish)return;try{await patch(id,{spanish,russian,definition:spanish+' — '+russian});EDIT=null;await load()}catch(e){console.error(e);msg.textContent='Error al guardar.'}}
async function toggleArchive(id){let x=DATA.find(x=>x.id===id);if(!x)return;try{await patch(id,{status:x.status==='archived'?'quizlet':'archived'});await load()}catch(e){console.error(e);msg.textContent='Error al cambiar el estado.'}}
async function removeWord(id){try{await patch(id,{status:'deleted'});await load()}catch(e){console.error(e);msg.textContent='Error al eliminar.'}}
async function load(){let r=await fetch(SB+'/rest/v1/cards?select=id,spanish,russian,status,created_at&order=created_at.desc',{headers:hdr});if(!r.ok)throw new Error(await r.text());DATA=await r.json();render()}
async function translate(s){try{let r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(s)+'&langpair=es|ru');let j=await r.json();return(j.responseData&&j.responseData.translatedText||'').trim()}catch(e){return''}}
function makeId(s){let base=s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,45)||'palabra';return base+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}
btn.onclick=async()=>{let pairs=[...rows.querySelectorAll('.row')].map(r=>({spanish:r.querySelector('.sp').value.trim(),russian:r.querySelector('.ru').value.trim()})).filter(x=>x.spanish);if(!pairs.length){msg.textContent='Añade al menos una palabra en español.';return}btn.disabled=true;msg.textContent='Añadiendo…';try{for(let p of pairs)if(!p.russian)p.russian=await translate(p.spanish);let today=new Date().toISOString().slice(0,10),payload=pairs.map(p=>({id:makeId(p.spanish),added_on:today,spanish:p.spanish,russian:p.russian,definition:p.spanish+' — '+p.russian,hints:[],status:'quizlet'}));let r=await fetch(SB+'/rest/v1/cards',{method:'POST',headers:{...hdr,'Prefer':'return=representation'},body:JSON.stringify(payload)});if(!r.ok)throw new Error(await r.text());rows.querySelectorAll('input').forEach(x=>x.value='');msg.textContent='Añadidas: '+payload.length+'.';await load()}catch(e){console.error(e);msg.textContent='Error al añadir. Inténtalo de nuevo.'}finally{btn.disabled=false}}
document.querySelector('#search').oninput=render;load().catch(e=>{console.error(e);cards.innerHTML='<div class="empty">Error de conexión.</div>'});setInterval(()=>load().catch(()=>{}),10000);
</script></body></html>
