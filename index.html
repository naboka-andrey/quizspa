<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Español — карточки</title><style>:root{--bg:#f5f5f5;--card:#fff;--text:#171717;--muted:#777;--border:#dedede;--active:#171717}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;padding:22px;user-select:none}.app{width:min(94vw,650px);margin:auto}.top{display:grid;grid-template-columns:72px 1fr 72px;align-items:center;gap:10px;margin-bottom:14px;color:var(--muted);font-size:14px}.counter{text-align:left}.shuffle{justify-self:end}.btn{border:1px solid var(--border);background:#fff;border-radius:12px;padding:9px 12px;font-size:15px;cursor:pointer}.filters{display:flex;justify-content:center;gap:6px}.filter{border:1px solid var(--border);background:#fff;color:#555;border-radius:999px;padding:8px 11px;font-size:13px;white-space:nowrap;cursor:pointer}.filter.active{background:var(--active);color:#fff;border-color:var(--active)}.scene{perspective:1000px}.card{width:100%;height:min(62vh,430px);min-height:330px;position:relative;transform-style:preserve-3d;transition:transform .35s;cursor:pointer;touch-action:pan-y}.card.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--border);border-radius:24px;box-shadow:0 12px 35px #00000014;display:flex;align-items:center;justify-content:center;padding:34px;text-align:center}.frontWord{font-size:clamp(30px,6vw,52px);font-weight:700;line-height:1.15}.back{transform:rotateY(180deg);display:block;overflow:hidden;padding:0}.spanishWord{position:absolute;left:30px;right:30px;top:50%;transform:translateY(-50%);font-size:clamp(30px,6vw,52px);font-weight:700;line-height:1.15;transition:.22s ease}.back.hint-open .spanishWord{top:42px;transform:none;font-size:clamp(25px,5vw,38px)}.cardActions{position:absolute;right:15px;top:15px;display:flex;gap:8px;z-index:5}.round{width:44px;height:44px;padding:0;border-radius:50%;font-size:20px;background:#f8f8f8}.star.active{background:#fff7d6;border-color:#e6c75b}.hintInside{position:absolute;left:22px;right:22px;top:102px;bottom:18px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s ease;overflow:auto;text-align:left}.back.hint-open .hintInside{opacity:1;transform:none;pointer-events:auto}.visual{height:84px;border-radius:16px;background:#f7f7f7;display:flex;align-items:center;justify-content:center;font-size:44px;letter-spacing:7px;margin-bottom:12px}.mnemo{font-size:15px;line-height:1.38}.mnemo b{font-size:16px}.etym{border-top:1px solid #ececec;margin-top:10px;padding-top:9px;color:#666;font-size:12px;line-height:1.35}.etym a{color:inherit}.empty{display:none;height:min(62vh,430px);min-height:330px;border:1px dashed #ccc;border-radius:24px;background:#fff;align-items:center;justify-content:center;text-align:center;color:#777;padding:28px}.empty.show{display:flex}.smallhint{text-align:center;color:var(--muted);font-size:12px;margin-top:9px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.nav{height:58px;font-size:26px}.btn:active,.filter:active{transform:scale(.98)}@media(max-width:520px){.top{grid-template-columns:48px 1fr 48px;gap:6px}.shuffle{font-size:0;width:44px;height:40px;padding:0}.shuffle:after{content:'🔀';font-size:18px}.filter{font-size:12px;padding:7px 8px}.counter{font-size:12px}.card{min-height:330px}.cardActions{right:12px;top:12px}.round{width:41px;height:41px}}@media(max-height:720px){.card,.empty{height:390px;min-height:310px}.visual{height:68px;font-size:36px}.mnemo{font-size:14px}.etym{font-size:11px}}</style></head><body><div class="app"><div class="top"><div class="counter" id="counter"></div><div class="filters"><button class="filter" data-filter="new">Новые</button><button class="filter" data-filter="favorites">★</button><button class="filter active" data-filter="all">Все</button></div><button class="btn shuffle" id="shuffle">🔀</button></div><div class="scene" id="scene"><div class="card" id="card"><div class="face front"><div class="frontWord" id="ru"></div></div><div class="face back" id="back"><div class="cardActions"><button class="btn round star" id="star">☆</button><button class="btn round" id="whisper">🤫</button></div><div class="spanishWord" id="es"></div><div class="hintInside" id="hintInside"><div class="visual" id="visual"></div><div class="mnemo" id="mnemo"></div><div class="etym" id="etym"></div></div></div></div></div><div class="empty" id="empty"></div><div class="smallhint">тап — переворот · ★ — избранное · 🤫 — подсказка · свайп — следующая</div><div class="controls"><button class="btn nav" id="prev">←</button><button class="btn nav" id="next">→</button></div></div><script>

{id:'entorno',added:'2026-07-07',ru:'окружение',es:'el entorno',v:'👤 🔄 🏠🌳👥',m:'<b>ENTORNO → TURN AROUND.</b> Повернулся и увидел всё своё окружение.',e:'Звуковая опора на англ. <i>turn</i>.',link:'https://en.wiktionary.org/wiki/entorno'},
{id:'crear',added:'2026-07-07',ru:'создать',es:'crear',v:'💡 ➕ 🛠️',m:'<b>CREAR → CREATE.</b> Почти одно и то же слово.',e:'Исп. <i>crear</i> и англ. <i>create</i> родственны.',link:'https://en.wiktionary.org/wiki/crear'},
{id:'fijar',added:'2026-07-07',ru:'закреплять / прикреплять',es:'fijar',v:'📌 📄 🔧',m:'<b>FIJAR → FIX.</b> FIX-ишь лист булавкой к стене.',e:'Англ. <i>fix</i> и исп. <i>fijar</i> исторически родственны.',link:'https://en.wiktionary.org/wiki/fijar'},

{id:'lo-que-sea',added:'2026-07-15',ru:'что угодно',es:'lo que sea',v:'🌊 🍕 🚲 🐘',m:'<b>LO QUE SEA → SEA со всем подряд.</b> В море плавают пицца, велосипед и слон — что угодно.',e:'Англ. <i>sea</i> — только звуковая ассоциация.',link:'https://en.wiktionary.org/wiki/sea#Spanish'},

{id:'conseguir',added:'2026-08-17',ru:'добиваться, получать',es:'conseguir',v:'🏆 🎯 🤲',m:'<b>CONSEGUIR → CONSEGUIЛ.</b> Долго добивался кубка — и наконец «КОНСЕГИР»: получил его в руки. Представь победителя, который кричит: «Я CONSEGUIЛ!»',e:'Полезная испанская связь: <i>conseguir</i> часто значит «добиться / суметь получить».',link:'https://en.wiktionary.org/wiki/conseguir'},

{id:'anadir',added:'2026-08-17',ru:'добавлять',es:'añadir',v:'➕ 🍲 🧂',m:'<b>AÑADIR → «А, НА, ДОБАВЬ!»</b> Повар забыл соль: «А! На, добавь ещё!» — и бросает её в кастрюлю. <b>AÑADIR</b> = добавлять.',e:'Для памяти главное звучание «анья-дир» и образ добавления чего-то сверху.',link:'https://en.wiktionary.org/wiki/a%C3%B1adir'},
{id:'escapar',added:'2026-08-17',ru:'избегать / ускользать',es:'escapar',v:'🏃 💨 🚪',m:'<b>ESCAPAR → ESCAPE.</b> Нажал ESCAPE и убежал от проблемы — избежал её. <b>Escapar</b> = ускользнуть, сбежать.',e:'Исп. <i>escapar</i> и англ. <i>escape</i> родственны.',link:'https://en.wiktionary.org/wiki/escapar'},
{id:'hartarse',added:'2026-08-17',ru:'осточертеть / пресытиться',es:'hartarse',v:'😫 🍔 🚫',m:'<b>HARTARSE → «ХАРЭ!»</b> Тебе уже осточертело: «ХАРЭ, хватит!» — <b>hartarse</b> = пресытиться, быть по горло сытым чем-то.',e:'Полезная конструкция: <i>hartarse de algo</i> — пресытиться / быть сытым по горло чем-то.',link:'https://en.wiktionary.org/wiki/hartarse'}];
let filter='all',cards=[],index=0,flipped=false;let favorites=new Set(JSON.parse(localStorage.getItem('quizspa-favorites')||'[]'));const card=document.querySelector('#card'),scene=document.querySelector('#scene'),empty=document.querySelector('#empty'),back=document.querySelector('#back'),ru=document.querySelector('#ru'),es=document.querySelector('#es'),counter=document.querySelector('#counter'),visual=document.querySelector('#visual'),mnemo=document.querySelector('#mnemo'),etym=document.querySelector('#etym'),whisper=document.querySelector('#whisper'),star=document.querySelector('#star');
function isNew(x){return (new Date()-new Date(x.added+'T00:00:00'))/86400000<=NEW_DAYS}function applyFilter(){cards=original.filter(x=>filter==='all'||filter==='new'&&isNew(x)||filter==='favorites'&&favorites.has(x.id));index=0;render()}function render(){flipped=false;card.classList.remove('flipped');back.classList.remove('hint-open');if(!cards.length){scene.style.display='none';empty.classList.add('show');empty.textContent=filter==='favorites'?'Пока нет избранных карточек. Поставь ★ на испанской стороне.':'В этом разделе пока нет карточек.';counter.textContent='0';return}scene.style.display='block';empty.classList.remove('show');let x=cards[index];ru.textContent=x.ru;es.textContent=x.es;visual.textContent=x.v;mnemo.innerHTML=x.m;etym.innerHTML=x.e+' <a href="'+x.link+'" target="_blank" rel="noopener">↗</a>';star.textContent=favorites.has(x.id)?'★':'☆';star.classList.toggle('active',favorites.has(x.id));counter.textContent=(index+1)+' / '+cards.length}function next(){if(cards.length){index=(index+1)%cards.length;render()}}function prev(){if(cards.length){index=(index-1+cards.length)%cards.length;render()}}function shuffle(){for(let i=cards.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]]}index=0;render()}card.addEventListener('click',()=>{flipped=!flipped;card.classList.toggle('flipped',flipped);if(!flipped)back.classList.remove('hint-open')});whisper.addEventListener('click',e=>{e.stopPropagation();back.classList.toggle('hint-open')});star.addEventListener('click',e=>{e.stopPropagation();if(!cards.length)return;let id=cards[index].id;if(favorites.has(id))favorites.delete(id);else favorites.add(id);localStorage.setItem('quizspa-favorites',JSON.stringify([...favorites]));if(filter==='favorites')applyFilter();else render()});document.querySelector('#hintInside').addEventListener('click',e=>e.stopPropagation());document.querySelector('#next').onclick=next;document.querySelector('#prev').onclick=prev;document.querySelector('#shuffle').onclick=shuffle;document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));applyFilter()});let sx=0,sy=0;card.addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});card.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy))dx<0?next():prev()},{passive:true});applyFilter();shuffle();
</script></body></html>
