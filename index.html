<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Español — карточки</title><style>:root{--bg:#f5f5f5;--card:#fff;--text:#171717;--muted:#777;--border:#dedede;--active:#171717}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;padding:22px;user-select:none}.app{width:min(94vw,650px);margin:auto}.top{display:grid;grid-template-columns:72px 1fr 72px;align-items:center;gap:10px;margin-bottom:14px;color:var(--muted);font-size:14px}.counter{text-align:left}.shuffle{justify-self:end}.btn{border:1px solid var(--border);background:#fff;border-radius:12px;padding:9px 12px;font-size:15px;cursor:pointer}.filters{display:flex;justify-content:center;gap:6px}.filter{border:1px solid var(--border);background:#fff;color:#555;border-radius:999px;padding:8px 11px;font-size:13px;white-space:nowrap;cursor:pointer}.filter.active{background:var(--active);color:#fff;border-color:var(--active)}.scene{perspective:1000px;visibility:hidden}.scene.ready{visibility:visible}.card{width:100%;height:min(62vh,430px);min-height:330px;position:relative;transform-style:preserve-3d;transition:transform .35s;cursor:pointer;touch-action:pan-y}.card.no-anim{transition:none!important}.card.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--border);border-radius:24px;box-shadow:0 12px 35px #00000014;display:block;overflow:hidden;text-align:center;transform:translateZ(0)}.front{z-index:2}.back{transform:rotateY(180deg) translateZ(0);z-index:1}.word{position:absolute;left:30px;right:30px;top:50%;transform:translateY(-50%);font-size:clamp(30px,6vw,52px);font-weight:700;line-height:1.15;transition:.22s ease}.face.hint-open .word{top:42px;transform:none;font-size:clamp(25px,5vw,38px)}.star,.whisper{position:absolute;top:15px;width:44px;height:44px;padding:0;border-radius:50%;font-size:20px;background:#f8f8f8;z-index:5}.star{right:15px}.whisper{right:67px}.star.active{background:#fff7d6;border-color:#e6c75b}.frontVisual{position:absolute;left:22px;right:22px;top:115px;bottom:22px;opacity:0;transform:translateY(8px);transition:.2s ease;display:flex;align-items:center;justify-content:center;pointer-events:none}.front.hint-open .frontVisual{opacity:1;transform:none}.visualOnly{width:100%;height:150px;border-radius:20px;background:#f7f7f7;display:flex;align-items:center;justify-content:center;font-size:54px;letter-spacing:9px}.hintInside{position:absolute;left:22px;right:22px;top:102px;bottom:18px;opacity:0;transform:translateY(8px);transition:.2s ease;overflow:auto;text-align:left;pointer-events:none}.back.hint-open .hintInside{opacity:1;transform:none}.visual{height:84px;border-radius:16px;background:#f7f7f7;display:flex;align-items:center;justify-content:center;font-size:44px;letter-spacing:7px;margin-bottom:12px}.mnemo{font-size:15px;line-height:1.38}.mnemo b{font-size:16px}.etym{border-top:1px solid #ececec;margin-top:10px;padding-top:9px;color:#666;font-size:12px;line-height:1.35}.empty{display:none;height:min(62vh,430px);min-height:330px;border:1px dashed #ccc;border-radius:24px;background:#fff;align-items:center;justify-content:center;text-align:center;color:#777;padding:28px}.empty.show{display:flex}.smallhint{text-align:center;color:var(--muted);font-size:12px;margin-top:9px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.nav{height:58px;font-size:26px}.btn:active,.filter:active{transform:scale(.98)}@media(max-width:520px){.top{grid-template-columns:48px 1fr 48px;gap:6px}.shuffle{font-size:0;width:44px;height:40px;padding:0}.shuffle:after{content:'🔀';font-size:18px}.filter{font-size:12px;padding:7px 8px}.counter{font-size:12px}.star,.whisper{top:12px;width:41px;height:41px}.star{right:12px}.whisper{right:61px}}@media(max-height:720px){.card,.empty{height:390px;min-height:310px}.visual{height:68px;font-size:36px}.mnemo{font-size:14px}.etym{font-size:11px}.visualOnly{height:125px;font-size:46px}}</style></head><body><div class="app"><div class="top"><div class="counter" id="counter"></div><div class="filters"><button class="filter" data-filter="new">Новые</button><button class="filter" data-filter="favorites">★</button><button class="filter active" data-filter="all">Все</button></div><button class="btn shuffle" id="shuffle">🔀</button></div><div class="scene" id="scene"><div class="card" id="card"><div class="face front" id="front"><button class="btn whisper" id="hintFront" title="Визуальная подсказка">🗣️</button><button class="btn star" id="starFront">☆</button><div class="word" id="ru"></div><div class="frontVisual"><div class="visualOnly" id="visualFront"></div></div></div><div class="face back" id="back"><button class="btn whisper" id="hintBack" title="Подсказка">🗣️</button><button class="btn star" id="starBack">☆</button><div class="word" id="es"></div><div class="hintInside"><div class="visual" id="visualBack"></div><div class="mnemo" id="mnemo"></div><div class="etym" id="etym"></div></div></div></div></div><div class="empty" id="empty"></div><div class="smallhint">тап — переворот · ★ — избранное · 🗣️ — подсказка · свайп — следующая</div><div class="controls"><button class="btn nav" id="prev">←</button><button class="btn nav" id="next">→</button></div></div><script>const NEW_DAYS=14;const original=[{id:'gritar',added:'2026-06-30',ru:'кричать',es:'gritar',v:'😱 🎸 🔊',m:'<b>GRITAR → GUITAR.</b> Человек орёт прямо в электрогитару и пытается её перекричать.',e:'Связь с guitar — звуковая мнемоника.'},{id:'molestar',added:'2026-06-30',ru:'раздражать',es:'molestar',v:'🦋 😤 👕',m:'<b>MOLESTAR → «МОЛЬ ДОСТАЛА».</b> Моль съела футболку: «Эта МОЛЬ меня ДОСТАЛА!»',e:'Англ. molest исторически родственно.'},{id:'lago',added:'2026-06-30',ru:'озеро',es:'lago',v:'⛺ 🏞️ 🔥',m:'<b>LAGO → ЛАГерь у озера.</b> Весь ЛАГерь стоит на берегу озера.',e:'Сравни англ. lake.'},{id:'bodega',added:'2026-06-30',ru:'винодельня',es:'bodega',v:'🍾 🍷 👃',m:'<b>BODEGA → BOttle + ДЕГустация.</b> Огромная bottle вина на дегустации.',e:'Англ. bodega заимствовано из испанского.'},{id:'de-hecho',added:'2026-06-30',ru:'по факту',es:'de hecho',v:'✅ 📄 🔨',m:'<b>DE HECHO → DE FACTO.</b> Две готовые конструкции со значением «по факту».',e:'Hecho также значит «факт / сделанное».'},{id:'entorno',added:'2026-07-07',ru:'окружение',es:'el entorno',v:'👤 🔄 🏠🌳👥',m:'<b>ENTORNO → TURN AROUND.</b> Повернулся и увидел всё своё окружение.',e:'Звуковая опора на англ. turn.'},{id:'crear',added:'2026-07-07',ru:'создать',es:'crear',v:'💡 ➕ 🛠️',m:'<b>CREAR → CREATE.</b> Почти одно и то же слово.',e:'Crear и create исторически родственны.'},{id:'fijar',added:'2026-07-07',ru:'закреплять / прикреплять',es:'fijar',v:'📌 📄 🔧',m:'<b>FIJAR → FIX.</b> FIX-ишь лист булавкой к стене.',e:'Fix и fijar исторически родственны.'},{id:'rendirse',added:'2026-07-07',ru:'сдаваться',es:'rendirse',v:'🏳️ 🙌 😵',m:'<b>RENDIRSE → SURRENDER.</b> Белый флаг и огромная надпись SURRENDER.',e:'Звуковой мост через английское surrender.'},{id:'suelo',added:'2026-07-07',ru:'пол',es:'el suelo',v:'👞 ⬇️ 🟫',m:'<b>SUELO → SOLE.</b> Подошва — sole — касается пола.',e:'Сравни англ. soil «почва».'},{id:'arbusto',added:'2026-07-09',ru:'куст',es:'un arbusto',v:'🍉 🌿 🌳',m:'<b>ARBUSTO → АРБУЗ на кусте.</b> Огромный арбуз растёт прямо на кусте.',e:'Связь с «арбуз» только звуковая.'},{id:'bosque',added:'2026-07-15',ru:'лес',es:'bosque',v:'🕶️ 👔 🌲🌲',m:'<b>BOSQUE → BOSS в лесу.</b> Босс в костюме и очках гуляет между соснами.',e:'Связь с boss — мнемоника.'},{id:'lo-que-sea',added:'2026-07-15',ru:'что угодно',es:'lo que sea',v:'🌊 🍕 🚲 🐘',m:'<b>LO QUE SEA → SEA со всем подряд.</b> В море плавают пицца, велосипед и слон — что угодно.',e:'Англ. sea — только звуковая ассоциация.'},{id:'matar',added:'2026-07-31',ru:'убить',es:'matar',v:'♟️ 👑 ☠️',m:'<b>MATAR → МАТ.</b> Поставил королю мат — король «убит».',e:'Созвучие с русским «мат» случайное.'},{id:'chocarse',added:'2026-08-06',ru:'пересечься / столкнуться',es:'chocarse',v:'🚗 💥 🚙 😱',m:'<b>CHOCARSE → SHOCK + CARS.</b> Две cars столкнулись — у всех shock.',e:'Chocarse — от chocar «столкнуться».'},{id:'conseguir',added:'2026-08-17',ru:'добиваться, получать',es:'conseguir',v:'🚬 🚬 🏁 🏥',m:'<b>CONSEGUIR → КОНЕЦ + СИГИ.</b> Докурил сиги до конца — <b>получил рак</b>. Неприятно, зато цепляется: conseguir = получить / добиться.',e:'Часто значит «добиться / суметь получить».'},{id:'mentir',added:'2026-08-17',ru:'врать',es:'mentir',v:'🤥 🧠 💬',m:'<b>MENTIR → MENTAL.</b> Врун придумывает всё у себя в голове и врёт.',e:'Звуковая ассоциация через англ. mental.'},{id:'anadir',added:'2026-08-17',ru:'добавлять',es:'añadir',v:'➕ 🍲 🧂',m:'<b>AÑADIR → «А, НА, ДОБАВЬ!»</b> Повар бросает ещё соли в кастрюлю.',e:'Звуковая мнемоника на «анья-дир».'},{id:'escapar',added:'2026-08-17',ru:'избегать / ускользать',es:'escapar',v:'🏃 💨 🚪',m:'<b>ESCAPAR → ESCAPE.</b> Нажал ESCAPE и убежал от проблемы.',e:'Escapar и escape родственны.'},{id:'hartarse',added:'2026-08-17',ru:'осточертеть / пресытиться',es:'hartarse',v:'😫 🍔 🚫',m:'<b>HARTARSE → «ХАРЭ!»</b> Тебе уже осточертело: «ХАРЭ, хватит!»',e:'Hartarse de algo — быть сытым по горло чем-то.'}];let filter='all',cards=[],index=0,flipped=false;let favorites=new Set(JSON.parse(localStorage.getItem('quizspa-favorites')||'[]'));const card=document.querySelector('#card'),scene=document.querySelector('#scene'),empty=document.querySelector('#empty'),front=document.querySelector('#front'),back=document.querySelector('#back'),ru=document.querySelector('#ru'),es=document.querySelector('#es'),counter=document.querySelector('#counter'),visualFront=document.querySelector('#visualFront'),visualBack=document.querySelector('#visualBack'),mnemo=document.querySelector('#mnemo'),etym=document.querySelector('#etym'),starFront=document.querySelector('#starFront'),starBack=document.querySelector('#starBack'),hintFront=document.querySelector('#hintFront'),hintBack=document.querySelector('#hintBack');function isNew(x){return(new Date()-new Date(x.added+'T00:00:00'))/86400000<=NEW_DAYS}function syncStars(id){let on=favorites.has(id);[starFront,starBack].forEach(s=>{s.textContent=on?'★':'☆';s.classList.toggle('active',on)})}function resetFrontInstant(){card.classList.add('no-anim');flipped=false;card.classList.remove('flipped');front.classList.remove('hint-open');back.classList.remove('hint-open');void card.offsetWidth}function finishInstantReset(){requestAnimationFrame(()=>card.classList.remove('no-anim'))}function render(){flipped=false;card.classList.remove('flipped');front.classList.remove('hint-open');back.classList.remove('hint-open');if(!cards.length){scene.style.display='none';empty.classList.add('show');empty.textContent=filter==='favorites'?'Пока нет избранных карточек. Поставь ★ на карточке.':'В этом разделе пока нет карточек.';counter.textContent='0';scene.classList.add('ready');return}scene.style.display='block';empty.classList.remove('show');let x=cards[index];ru.textContent=x.ru;es.textContent=x.es;visualFront.textContent=x.v;visualBack.textContent=x.v;mnemo.innerHTML=x.m;etym.textContent=x.e;syncStars(x.id);counter.textContent=(index+1)+' / '+cards.length;requestAnimationFrame(()=>scene.classList.add('ready'))}function goTo(newIndex){if(!cards.length)return;resetFrontInstant();index=newIndex;render();finishInstantReset()}function next(){goTo((index+1)%cards.length)}function prev(){goTo((index-1+cards.length)%cards.length)}function shuffle(){resetFrontInstant();for(let i=cards.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]]}index=0;render();finishInstantReset()}function applyFilter(){resetFrontInstant();cards=original.filter(x=>filter==='all'||filter==='new'&&isNew(x)||filter==='favorites'&&favorites.has(x.id));index=0;render();finishInstantReset()}function toggleFavorite(e){e.stopPropagation();if(!cards.length)return;let id=cards[index].id;favorites.has(id)?favorites.delete(id):favorites.add(id);localStorage.setItem('quizspa-favorites',JSON.stringify([...favorites]));if(filter==='favorites')applyFilter();else syncStars(id)}card.addEventListener('click',()=>{flipped=!flipped;card.classList.toggle('flipped',flipped);if(flipped)front.classList.remove('hint-open');else back.classList.remove('hint-open')});starFront.addEventListener('click',toggleFavorite);starBack.addEventListener('click',toggleFavorite);hintFront.addEventListener('click',e=>{e.stopPropagation();front.classList.toggle('hint-open')});hintBack.addEventListener('click',e=>{e.stopPropagation();back.classList.toggle('hint-open')});document.querySelector('#next').onclick=next;document.querySelector('#prev').onclick=prev;document.querySelector('#shuffle').onclick=shuffle;document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));applyFilter()});let sx=0,sy=0;card.addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});card.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy))dx<0?next():prev()},{passive:true});applyFilter();shuffle();</script></body></html>
