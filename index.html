}}</style><div class="app"><div class="top"><span id="count"></span><div class="filters"><button class="f active" data-f="new">Новые</button><button class="f" data-f="fav">★</button><button class="f" data-f="all">Все</button></div><button id="sh">🔀</button></div><div class="scene" id="scene"><div class="card" id="card"><div class="face front" id="front"><button class="icon hint" id="hf">🗣️🤚</button><button class="icon star" id="sf">☆</button><div class="word" id="ru"></div><div class="panel"><div class="visual" id="vf"></div></div></div><div class="face back" id="back"><button class="icon dict" id="db">📄</button><button class="icon hint" id="hb">🗣️🤚</button><button class="icon star" id="sb">☆</button><div class="word" id="es"></div><div class="panel" id="bp"><div class="visual" id="vb"></div><div class="txt" id="mn"></div><button class="refresh" id="rh">↻ Другая подсказка</button></div><div class="panel" id="dp"><div class="txt" id="dt"></div></div></div></div></div><div class="empty" id="empty"></div><div class="small">тап — переворот · ★ — избранное · 🗣️🤚 — подсказка · 📄 — словарь</div><div class="controls"><button id="pr">←</button><button id="nx">→</button></div></div><script>const A=[{"i":"gritar","a":"2026-06-30","r":"кричать","s":"gritar","v":"😱 🎸 🔊","m":"GRITAR → GUITAR. Человек орёт прямо в электрогитару и пытается её перекричать.","n":"Представь, как кто-то так громко кричит: «ГРИ-ТА-А-АР!», что дрожат стены.","d":"gritar — кричать, орать; выкрикивать; громко звать."},{"i":"molestar","a":"2026-06-30","r":"раздражать","s":"molestar","v":"🦋 😤 👕","m":"MOLESTAR → «МОЛЬ ДОСТАЛА». Моль съела футболку: «Эта МОЛЬ меня ДОСТАЛА!»","n":"Кто-то бесконечно мешает тебе: molest-ar — «мол, достал уже».","d":"molestar — беспокоить, мешать, раздражать, докучать."},{"i":"lago","a":"2026-06-30","r":"озеро","s":"lago","v":"⛺ 🏞️ 🔥","m":"LAGO → ЛАГерь у озера. Весь лагерь стоит на берегу озера.","n":"ЛАГО звучит как начало «лагуна» — представь спокойную воду.","d":"el lago — озеро."},{"i":"bodega","a":"2026-06-30","r":"винодельня","s":"bodega","v":"🍾 🍷 👃","m":"BODEGA → BOttle + ДЕГустация. Огромная bottle вина на дегустации.","n":"В бодеге стоят бочки и бутылки вина — прямо винный дом.","d":"la bodega — винодельня; винный погреб; склад."},{"i":"de-hecho","a":"2026-06-30","r":"по факту","s":"de hecho","v":"✅ 📄 🔨","m":"DE HECHO → DE FACTO. Две готовые конструкции со значением «по факту».","n":"Hecho — факт/сделанное: de hecho = по факту, на самом деле.","d":"de hecho — фактически, на самом деле, в действительности."},{"i":"entorno","a":"2026-07-07","r":"окружение","s":"el entorno","v":"👤 🔄 🏠🌳👥","m":"ENTORNO → TURN AROUND. Повернулся и увидел всё своё окружение.","n":"ENTORNO — всё, что «вокруг»: люди, дома, среда.","d":"el entorno — окружение, среда, обстановка."},{"i":"crear","a":"2026-07-07","r":"создать","s":"crear","v":"💡 ➕ 🛠️","m":"CREAR → CREATE. Почти одно и то же слово.","n":"CREAR — создать: как creator, который что-то создаёт.","d":"crear — создавать, творить."},{"i":"fijar","a":"2026-07-07","r":"закреплять / прикреплять","s":"fijar","v":"📌 📄 🔧","m":"FIJAR → FIX. FIX-ишь лист булавкой к стене.","n":"Fijar = зафиксировать: fijar una fecha — зафиксировать дату.","d":"fijar — закреплять, фиксировать; устанавливать, назначать."},{"i":"rendirse","a":"2026-07-07","r":"сдаваться","s":"rendirse","v":"🏳️ 🙌 😵","m":"RENDIRSE → SURRENDER. Белый флаг и огромная надпись SURRENDER.","n":"Me rindo! — «Я сдаюсь!» Запомни готовой фразой.","d":"rendirse — сдаваться, капитулировать."},{"i":"suelo","a":"2026-07-07","r":"пол","s":"el suelo","v":"👞 ⬇️ 🟫","m":"SUELO → SOLE. Подошва — sole — касается пола.","n":"Suelo — то, что под ногами: пол или земля.","d":"el suelo — пол; земля, почва."},{"i":"arbusto","a":"2026-07-09","r":"куст","s":"un arbusto","v":"🍉 🌿 🌳","m":"ARBUSTO → АРБУЗ на кусте. Огромный арбуз растёт прямо на кусте.","n":"AR-BUSTO: маленький «буст» зелени рядом с землёй — куст.","d":"el arbusto — куст, кустарник."},{"i":"bosque","a":"2026-07-15","r":"лес","s":"bosque","v":"🕶️ 👔 🌲🌲","m":"BOSQUE → BOSS в лесу. Босс в костюме гуляет между соснами.","n":"Bosque — густой лес: много деревьев вокруг.","d":"el bosque — лес."},{"i":"lo-que-sea","a":"2026-07-15","r":"что угодно","s":"lo que sea","v":"🌊 🍕 🚲 🐘","m":"LO QUE SEA → SEA со всем подряд. В море плавают пицца, велосипед и слон — что угодно.","n":"Lo que sea = буквально «что бы это ни было».","d":"lo que sea — что угодно; всё что угодно."},{"i":"matar","a":"2026-07-31","r":"убить","s":"matar","v":"♟️ 👑 ☠️","m":"MATAR → МАТ. Поставил королю мат — король «убит».","n":"Matar — лишить жизни. Представь финальный «мат» в шахматах.","d":"matar — убивать."},{"i":"chocarse","a":"2026-08-06","r":"пересечься / столкнуться","s":"chocarse","v":"🚗 💥 🚙 😱","m":"CHOCARSE → SHOCK + CARS. Две cars столкнулись — у всех shock.","n":"Chocarse — буквально столкнуться: две машины — ¡choque!","d":"chocarse — столкнуться, врезаться."},{"i":"conseguir","a":"2026-08-17","r":"добиваться, получать","s":"conseguir","v":"🚬 🚬 🏁 🏥","m":"CONSEGUIR → КОНЕЦ + СИГИ. Докурил сиги до конца — получил результат.","n":"Conseguir = добиться: цель была далеко, но ты её всё-таки получил.","d":"conseguir — получать, добывать; добиваться; суметь."},{"i":"mentir","a":"2026-08-17","r":"врать","s":"mentir","v":"🤥 🧠 💬","m":"MENTIR → MENTAL. Врун придумывает всё у себя в голове.","n":"No me mientas — не ври мне. Запомни эту фразу целиком.","d":"mentir — лгать, врать."},{"i":"anadir","a":"2026-08-17","r":"добавлять","s":"añadir","v":"➕ 🍲 🧂","m":"AÑADIR → «А, НА, ДОБАВЬ!» Повар бросает ещё соли в кастрюлю.","n":"Añadir = добавить ещё один ингредиент или пункт.","d":"añadir — добавлять, прибавлять, присоединять."},{"i":"escapar","a":"2026-08-17","r":"избегать / ускользать","s":"escapar","v":"🏃 💨 🚪","m":"ESCAPAR → ESCAPE. Нажал ESCAPE и убежал от проблемы.","n":"Escapar — сбежать через дверь, ускользнуть.","d":"escapar / escaparse — убегать, сбегать; ускользать."},{"i":"hartarse","a":"2026-08-17","r":"осточертеть / пресытиться","s":"hartarse","v":"😫 🍔 🚫","m":"HARTARSE → «ХАРЭ!» Тебе уже осточертело: «ХАРЭ, хватит!»","n":"Estoy harto de esto — мне это уже осточертело.","d":"hartarse — пресытиться; быть сытым по горло."},{"i":"dejar-resena","a":"2026-09-12","r":"оставить отзыв","s":"dejar la reseña","v":"⭐ ✍️ 📱","m":"DEJAR LA RESEÑA — буквально «оставить отзыв»: оставляешь звёзды и текст.","n":"Представь: после ресторана ты DEJAS una RESEÑA в телефоне.","d":"dejar la reseña — оставить отзыв."},{"i":"propina","a":"2026-09-12","r":"чаевые","s":"la propina","v":"💶 🍽️ 🙏","m":"PROPINA — монетка поверх счёта официанту.","n":"ПроПИНА: «припинаешь» пару евро к счёту — чаевые.","d":"la propina — чаевые."},{"i":"prestamo","a":"2026-09-12","r":"долг / кредит","s":"un préstamo","v":"🏦 💸 📄","m":"PRÉSTAMO — банк «предоставил» тебе деньги в кредит.","n":"Представь банковский договор и деньги, которые потом надо вернуть.","d":"un préstamo — заём, кредит."},{"i":"pedir-prestamo","a":"2026-09-12","r":"взять кредит","s":"pedir un préstamo","v":"🙋 🏦 💸","m":"PEDIR = просить. Просишь у банка préstamo — берёшь кредит.","n":"В банке поднимаешь руку: «Quiero pedir un préstamo».","d":"pedir un préstamo — взять/попросить кредит."},{"i":"superpoder","a":"2026-09-12","r":"сверхспособность","s":"súperpoder","v":"🦸 ⚡ ✨","m":"SÚPERPODER — почти как superpower: супер + сила.","n":"Представь супергероя с одной необычной способностью.","d":"el súperpoder — сверхспособность."},{"i":"embajada","a":"2026-09-12","r":"посольство","s":"la embajada","v":"🏛️ 🇪🇸 🛂","m":"EMBAJADA — здание с флагом страны и дипломатами.","n":"Свяжи с ambassador: посол работает в embajada.","d":"la embajada — посольство."},{"i":"saltar","a":"2026-09-12","r":"прыгнуть / прыгать","s":"saltar","v":"🦘 ⬆️ 🏃","m":"SALTAR — подпрыгнуть вверх, как будто тебя подбросила соль SAL.","n":"Запомни командой: ¡Salta! — прыгай!","d":"saltar — прыгать, перепрыгивать."},{"i":"debilidad","a":"2026-09-12","r":"слабость","s":"la debilidad","v":"🥴 💔 🔋","m":"DEBILIDAD → débil = слабый. Слабость — состояние débil.","n":"Батарейка почти пустая — debilidad.","d":"la debilidad — слабость."},{"i":"fiebre","a":"2026-09-12","r":"жар / температура","s":"la fiebre","v":"🌡️ 🤒 🔥","m":"FIEBRE — градусник и жар: температура поднялась.","n":"Представь человека, которого буквально «печёт» от fiebre.","d":"la fiebre — жар, лихорадка, повышенная температура."},{"i":"por-fin","a":"2026-09-12","r":"наконец-то","s":"por fin","v":"🏁 😮‍💨 ✅","m":"POR FIN — FIN = конец. Наконец-то дошли до конца!","n":"Финишная лента: por fin — наконец-то.","d":"por fin — наконец, наконец-то."},{"i":"postre","a":"2026-09-12","r":"десерт","s":"un postre","v":"🍰 🍮 😋","m":"POSTRE — сладкое после основной еды.","n":"После пасты приходит POST-re: то, что идёт post, после.","d":"un postre — десерт."},{"i":"fuerzas","a":"2026-09-12","r":"силы","s":"las fuerzas","v":"💪 ⚡ 🔋","m":"FUERZAS — силы, энергия, мощь.","n":"Когда батарейка полная, у тебя есть fuerzas.","d":"las fuerzas — силы; энергия."},{"i":"teclado","a":"2026-09-12","r":"клавиатура","s":"el teclado","v":"⌨️ 💻 👆","m":"TECLADO — клавиши под пальцами, обычная клавиатура.","n":"Tecla = клавиша, teclado = набор клавиш.","d":"el teclado — клавиатура."},{"i":"detalles","a":"2026-09-12","r":"нюансы / детали","s":"los detalles","v":"🔍 🧩 📌","m":"DETALLES — детали и нюансы, почти как английское details.","n":"Увеличительное стекло показывает мелкие detalles.","d":"los detalles — детали, подробности, нюансы."},{"i":"predecir","a":"2026-09-12","r":"предсказать","s":"predecir","v":"🔮 🗣️ ⏩","m":"PREDECIR = pre + decir: сказать заранее.","n":"Гадалка говорит о будущем — pre-decir.","d":"predecir — предсказывать."},{"i":"desarrollar","a":"2026-09-12","r":"развивать","s":"desarrollar","v":"🌱 📈 🛠️","m":"DESARROLLAR — развивать проект: он растёт от идеи к результату.","n":"Представь график, который развивается вверх.","d":"desarrollar — развивать, разрабатывать."},{"i":"ciudadano","a":"2026-09-12","r":"гражданин / гражданка","s":"ciudadano/a","v":"🏙️ 🪪 👤","m":"CIUDADANO — человек города/страны, гражданин.","n":"Ciudad = город; ciudadano — житель/гражданин.","d":"ciudadano/a — гражданин / гражданка."},{"i":"tetera","a":"2026-09-12","r":"чайник / заварочник","s":"la tetera","v":"🫖 ☕ ♨️","m":"TETERA — чайник для чая, почти слышится «tea».","n":"Tetera стоит на столе рядом с чашками.","d":"la tetera — чайник, заварочный чайник."},{"i":"devolver","a":"2026-09-12","r":"вернуть","s":"devolver","v":"↩️ 📦 🤲","m":"DEVOLVER — вернуть назад: товар возвращается продавцу.","n":"VOLVER = возвращаться; de-volver — вернуть что-то обратно.","d":"devolver — возвращать, отдавать обратно."},{"i":"acogedor","a":"2026-09-12","r":"уютный","s":"acogedor","v":"🛋️ 🕯️ ☕","m":"ACOGEDOR — тёплая комната, плед и чай: уютно.","n":"Представь место, которое тебя словно «обнимает».","d":"acogedor/a — уютный, гостеприимный."},{"i":"incendio","a":"2026-09-12","r":"пожар","s":"el incendio","v":"🔥 🚒 🏠","m":"INCENDIO — дом в огне и пожарная машина.","n":"Свяжи с incendiary / ignition: всё горит.","d":"el incendio — пожар."}],D=14;let f="new",C=[],k=0,F=0,alt={},fav=new Set(JSON.parse(localStorage.getItem("quizspa-favorites")||"[]"));const q=x=>document.querySelector(x),card=q("#card"),front=q("#front"),back=q("#back"),ru=q("#ru"),es=q("#es"),count=q("#count"),vf=q("#vf"),vb=q("#vb"),mn=q("#mn"),dt=q("#dt"),sf=q("#sf"),sb=q("#sb"),hf=q("#hf"),hb=q("#hb"),db=q("#db"),bp=q("#bp"),dp=q("#dp"),scene=q("#scene"),empty=q("#empty");function isN(x){return(new Date()-new Date(x.a+"T00:00:00"))/864e5<=D}function stars(x){let z=fav.has(x.i);sf.textContent=sb.textContent=z?"★":"☆"}function close(){front.classList.remove("open");back.classList.remove("open");bp.style.display=dp.style.display=""}function hint(x){vb.textContent=x.v;mn.textContent=alt[x.i]?x.n:x.m}function render(){F=0;card.classList.remove("flip");close();if(!C.length){scene.style.display="none";empty.style.display="block";empty.textContent=f==="fav"?"Пока нет избранных":"В эт
