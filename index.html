<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Español — карточки</title><style>
:root{--bg:#f5f5f5;--card:#fff;--text:#171717;--muted:#777;--border:#dedede}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;padding:22px;user-select:none}.app{width:min(92vw,620px);margin:auto}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;color:var(--muted);font-size:14px}.btn{border:1px solid var(--border);background:#fff;border-radius:12px;padding:9px 12px;font-size:15px;cursor:pointer}.scene{perspective:1000px}.card{width:100%;height:min(62vh,430px);min-height:330px;position:relative;transform-style:preserve-3d;transition:transform .35s;cursor:pointer;touch-action:pan-y}.card.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--border);border-radius:24px;box-shadow:0 12px 35px #00000014;display:flex;align-items:center;justify-content:center;padding:34px;text-align:center}.frontWord{font-size:clamp(30px,6vw,52px);font-weight:700;line-height:1.15}.back{transform:rotateY(180deg);display:block;overflow:hidden;padding:0}.spanishWord{position:absolute;left:30px;right:30px;top:50%;transform:translateY(-50%);font-size:clamp(30px,6vw,52px);font-weight:700;line-height:1.15;transition:.22s ease}.back.hint-open .spanishWord{top:42px;transform:none;font-size:clamp(25px,5vw,38px)}.whisper{position:absolute;right:15px;top:15px;width:45px;height:45px;padding:0;border-radius:50%;font-size:21px;z-index:5;background:#f8f8f8}.hintInside{position:absolute;left:22px;right:22px;top:102px;bottom:18px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s ease;overflow:auto;text-align:left}.back.hint-open .hintInside{opacity:1;transform:none;pointer-events:auto}.visual{height:84px;border-radius:16px;background:#f7f7f7;display:flex;align-items:center;justify-content:center;font-size:44px;letter-spacing:7px;margin-bottom:12px}.mnemo{font-size:15px;line-height:1.38}.mnemo b{font-size:16px}.etym{border-top:1px solid #ececec;margin-top:10px;padding-top:9px;color:#666;font-size:12px;line-height:1.35}.etym a{color:inherit}.smallhint{text-align:center;color:var(--muted);font-size:12px;margin-top:9px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.nav{height:58px;font-size:26px}.btn:active{transform:scale(.98)}@media(max-height:720px){.card{height:390px;min-height:310px}.visual{height:68px;font-size:36px}.mnemo{font-size:14px}.etym{font-size:11px}}
</style></head><body><div class="app"><div class="top"><div id="counter"></div><button class="btn" id="shuffle">🔀 Shuffle</button></div><div class="scene"><div class="card" id="card"><div class="face front"><div class="frontWord" id="ru"></div></div><div class="face back" id="back"><button class="btn whisper" id="whisper" title="Подсказка">🤫</button><div class="spanishWord" id="es"></div><div class="hintInside" id="hintInside"><div class="visual" id="visual"></div><div class="mnemo" id="mnemo"></div><div class="etym" id="etym"></div></div></div></div></div><div class="smallhint">тап — переворот · 🤫 — подсказка · свайп — следующая</div><div class="controls"><button class="btn nav" id="prev">←</button><button class="btn nav" id="next">→</button></div></div><script>
const original=[
{ru:'кричать',es:'gritar',v:'😱 🎸 🔊',m:'<b>GRITAR → GUITAR.</b> Вообрази человека, который орёт прямо в электрогитару и пытается её перекричать. Гитара орёт — <b>GRITAR</b>.',e:'Этимология тут не помогает: связь с <i>guitar</i> только звуковая мнемоника.',link:'https://en.wiktionary.org/wiki/gritar'},
{ru:'раздражать',es:'molestar',v:'🦋 😤 👕',m:'<b>MOLESTAR → «МОЛЬ ДОСТАЛА».</b> Моль опять съела любимую футболку. Ты в бешенстве: «Эта МОЛЬ меня ДОСТАЛА!» → <b>molestar</b> = раздражать / беспокоить.',e:'У английского <i>molest</i> тот же исторический корень со значением «беспокоить», хотя современное английское слово часто имеет другое, более узкое значение.',link:'https://en.wiktionary.org/wiki/molestar'},
{ru:'озеро',es:'lago',v:'⛺ 🏞️ 🔥',m:'<b>LAGO → ЛАГерь у озера.</b> Палатка, костёр, а весь <b>ЛАГ</b>ерь стоит прямо на берегу озера. ЛАГерь → <b>LAGO</b>.',e:'Полезная английская связь: <i>lake</i> — родственное по древнему происхождению слово и означает то же самое.',link:'https://en.wiktionary.org/wiki/lago#Spanish'},
{ru:'винодельня',es:'bodega',v:'🍾 🍷 👃',m:'<b>BODEGA → BOttle + DEГустация.</b> Огромная BOttle вина стоит посреди ДЕГустации на винодельне. BO + DEGA → <b>BODEGA</b>.',e:'Английское <i>bodega</i> существует как заимствование из испанского; в испанском это также погреб/склад/винный погреб.',link:'https://en.wiktionary.org/wiki/bodega'},
{ru:'по факту',es:'de hecho',v:'✅ 📄 🔨',m:'<b>DE HECHO → DE FACTO.</b> Просто сцепи две готовые конструкции: знакомое «де-факто» = по факту, а по-испански это <b>de hecho</b>.',e:'<i>Hecho</i> также означает «факт» и «сделанное». Это уже полезная внутренняя связь: <i>de hecho</i> = фактически.',link:'https://en.wiktionary.org/wiki/hecho#Spanish'},
{ru:'окружение',es:'el entorno',v:'👤 🔄 🏠🌳👥',m:'<b>ENTORNO → TURN AROUND.</b> Ты поворачиваешься — <i>turn</i> — и видишь всё, что находится вокруг тебя: людей, дома, деревья. Всё вокруг = <b>entorno</b>.',e:'Звуковая опора здесь на английское <i>turn</i>; смысл тоже помогает: окружение — всё вокруг.',link:'https://en.wiktionary.org/wiki/entorno'},
{ru:'создать',es:'crear',v:'💡 ➕ 🛠️',m:'<b>CREAR → CREATE.</b> Почти одно и то же слово. CREATE something = создать что-то → <b>crear</b>.',e:'Это не случайность: исп. <i>crear</i> и англ. <i>create</i> исторически родственны.',link:'https://en.wiktionary.org/wiki/crear'},
{ru:'закреплять / прикреплять',es:'fijar',v:'📌 📄 🔧',m:'<b>FIJAR → FIX.</b> Берёшь булавку и буквально FIX-ишь лист к стене. FIX → <b>fijar</b> = закреплять.',e:'Здесь есть и реальная историческая связь через латинский корень: англ. <i>fix</i> и исп. <i>fijar</i> родственны.',link:'https://en.wiktionary.org/wiki/fijar'},
{ru:'сдаваться',es:'rendirse',v:'🏳️ 🙌 😵',m:'<b>RENDIRSE → SURRENDER.</b> В слове sur<b>render</b> уже слышится кусок <b>rendir-</b>. Представь белый флаг и огромную надпись SURRENDER → <b>rendirse</b>.',e:'Это хороший звуковой мост через знакомое английское <i>surrender</i>; точная история слов сложнее.',link:'https://en.wiktionary.org/wiki/rendirse'},
{ru:'пол',es:'el suelo',v:'👞 ⬇️ 🟫',m:'<b>SUELO → SOLE.</b> Подошва обуви — <i>sole</i> — всё время касается пола. SOLE на полу → <b>suelo</b>.',e:'Есть и реальная связь с английским <i>soil</i> «почва»: слова исторически родственны.',link:'https://en.wiktionary.org/wiki/suelo'},
{ru:'куст',es:'un arbusto',v:'🍉 🌿 🌳',m:'<b>ARBUSTO → АРБУЗ на кусте.</b> Представь гигантский АРБУЗ, который почему-то вырос не на земле, а прямо на кусте. АРБУЗ-то → <b>arbusto</b>.',e:'Мнемоника через «арбуз» звуковая. Само слово <i>arbusto</i> исторически связано с древесной/растительной лексикой.',link:'https://en.wiktionary.org/wiki/arbusto'},
{ru:'лес',es:'bosque',v:'🕶️ 👔 🌲🌲',m:'<b>BOSQUE → BOSS в лесу.</b> Серьёзный BOSS в тёмных очках и костюме идёт между соснами на деловую встречу. BOSS + лес → <b>bosque</b>.',e:'Связь с английским <i>boss</i> выдуманная и нужна только для памяти.',link:'https://en.wiktionary.org/wiki/bosque'},
{ru:'что угодно',es:'lo que sea',v:'🌊 🍕 🚲 🐘',m:'<b>LO QUE SEA → SEA со всем подряд.</b> В море — <i>sea</i> — плавает вообще всё: пицца, велосипед, слон. В SEA может быть «что угодно» → <b>lo que sea</b>.',e:'Звуковая ассоциация с англ. <i>sea</i> случайна. По-испански <i>sea</i> — форма глагола <i>ser</i>.',link:'https://en.wiktionary.org/wiki/sea#Spanish'},
{ru:'убить',es:'matar',v:'♟️ 👑 ☠️',m:'<b>MATAR → МАТ.</b> Поставил королю МАТ — партия закончилась, король «убит». МАТ → <b>matar</b>.',e:'Созвучие с русским «мат» случайное, но для запоминания очень сильное.',link:'https://en.wiktionary.org/wiki/matar#Spanish'},
{ru:'пересечься / столкнуться',es:'chocarse',v:'🚗 💥 🚙 😱',m:'<b>CHOCARSE → SHOCK + CARS.</b> Две CARS сталкиваются — у всех SHOCK. SHOCK-CARS → <b>chocarse</b>.',e:'Мнемоника специально склеивает два очень знакомых английских слова; <i>chocarse</i> — возвратная форма от <i>chocar</i> «столкнуться».',link:'https://en.wiktionary.org/wiki/chocar'}];
let cards=[...original],index=0,flipped=false;const card=document.querySelector('#card'),back=document.querySelector('#back'),ru=document.querySelector('#ru'),es=document.querySelector('#es'),counter=document.querySelector('#counter'),visual=document.querySelector('#visual'),mnemo=document.querySelector('#mnemo'),etym=document.querySelector('#etym'),whisper=document.querySelector('#whisper');
function render(){flipped=false;card.classList.remove('flipped');back.classList.remove('hint-open');let x=cards[index];ru.textContent=x.ru;es.textContent=x.es;visual.textContent=x.v;mnemo.innerHTML=x.m;etym.innerHTML=x.e+' <a href="'+x.link+'" target="_blank" rel="noopener">↗ источник</a>';counter.textContent=(index+1)+' / '+cards.length}function next(){index=(index+1)%cards.length;render()}function prev(){index=(index-1+cards.length)%cards.length;render()}function shuffle(){for(let i=cards.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]]}index=0;render()}
card.addEventListener('click',()=>{flipped=!flipped;card.classList.toggle('flipped',flipped);if(!flipped)back.classList.remove('hint-open')});whisper.addEventListener('click',e=>{e.stopPropagation();back.classList.toggle('hint-open')});document.querySelector('#hintInside').addEventListener('click',e=>e.stopPropagation());document.querySelector('#next').onclick=next;document.querySelector('#prev').onclick=prev;document.querySelector('#shuffle').onclick=shuffle;document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev();if(e.key===' '||e.key==='Enter'){e.preventDefault();card.click()}});let sx=0,sy=0;card.addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});card.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy))dx<0?next():prev()},{passive:true});shuffle();
</script></body></html>
