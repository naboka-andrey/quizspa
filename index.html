<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Español — карточки</title><style>:root{--bg:#f5f5f5;--card:#fff;--text:#171717;--muted:#777;--border:#dedede;--active:#171717}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;padding:22px;user-select:none}.app{width:min(94vw,650px);margin:auto}.top{display:grid;grid-template-columns:72px 1fr 72px;align-items:center;gap:10px;margin-bottom:14px;color:var(--muted);font-size:14px}.counter{text-align:left}.shuffle{justify-self:end}.btn{border:1px solid var(--border);background:#fff;border-radius:12px;padding:9px 12px;font-size:15px;cursor:pointer}.filters{display:flex;justify-content:center;gap:6px}.filter{border:1px solid var(--border);background:#fff;color:#555;border-radius:999px;padding:8px 11px;font-size:13px;white-space:nowrap;cursor:pointer}.filter.active{background:var(--active);color:#fff;border-color:var(--active)}.scene{perspective:1000px;visibility:hidden}.scene.ready{visibility:visible}.card{width:100%;height:min(62vh,430px);min-height:330px;position:relative;transform-style:preserve-3d;transition:transform .35s;cursor:pointer;touch-action:pan-y}.card.no-anim{transition:none!important}.card.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--border);border-radius:24px;box-shadow:0 12px 35px #00000014;display:block;overflow:hidden;text-align:center;transform:translateZ(0)}.front{z-index:2}.back{transform:rotateY(180deg) translateZ(0);z-index:1}.word{position:absolute;left:30px;right:30px;top:50%;transform:translateY(-50%);font-size:clamp(30px,6vw,52px);font-weight:700;line-height:1.15;transition:.22s ease}.face.info-open .word{top:4 r{font-size:12px}.icon{top:12px;width:41px;height:41px}.star{right:12px}.hint{right:61px}.dict{right:110px}.card{min-height:350px}}@media(max-height:720px){.card,.empty{height:400px;min-height:320px}.visual{height:68px;font-size:36px}.mnemo{font-size:14px}.etym{font-size:11px}.visualOnly{height:125px;font-size:46px}.dictText{font-size:13px}}</style></head><body><div class="app"><div class="top"><div class="counter" id="counter"></div><div class="filters"><button class="filter" data-filter="new">Новые</button><button class="filter" data-filter="favorites">★</button><button class="filter active" data-filter="all">Все</button></div><button class="btn shuffle" id="shuffle">🔀</button></div><div class="scene" id="scene"><div class="card" id="card"><div class="face front" id="front"><button class="btn icon hint" id="hintFront" title="Визуальная подсказка">🗣️</button><button class="btn icon star" id="starFront">☆</button><div class="word" id="ru"></div><div class="frontVisual"><div class="visualOnly" id="visualFront"></div></div></div><div class="face back" id="back"><button class="btn icon dict" id="dictBtn" title="Словарное значение">📄</button><button class="btn icon hint" id="hintBack" title="Мнемоника">🗣️</button><button class="btn icon star" id="starBack">☆</button><div class="word" id="es"></div><div class="panel hintPanel"><div class="visual" id="visualBack"></div><div class="mnemo" id="mnemo"></div><div class="etym" id="etym"></div></div><div class="panel dictPanel"><div class="dictText" id="dictText"></div></div></div></div></div><div class="empty" id="empty"></div><div class="smallhint">тап — переворот · ★ — избранное · 🗣️ — подсказка · 📄 — словарь</div><div class="controls"><button class="btn nav" id="prev">←</button><button class="btn nav" id="next">→</button></div></div><script>
const NEW_DAYS=14;const original=[
{id:'gritar',added:'2026-06-30',ru:'кричать',es:'gritar',v:'😱 🎸 🔊',m:'<b>GRITAR → GUITAR.</b> Человек орёт прямо в электрогитару и пытается её перекричать.',e:'Связь с guitar — звуковая мнемоника.',d:'<b>gritar</b> — кричать, орать; выкрикивать; громко звать.<br>1. Повышать голос, говорить очень громко.<br>2. Выкрикивать слова, лозунги, имя человека.<div class="ex"><i>Gritó mi nombre.</i> — Он выкрикнул моё имя.<br><i>No me grites.</i> — Не кричи на меня.</div>'},
{id:'molestar',added:'2026-06-30',ru:'раздражать',es:'molestar',v:'🦋 😤 👕',m:'<b>MOLESTAR → «МОЛЬ ДОСТАЛА».</b> Моль съела футболку: «Эта МОЛЬ меня ДОСТАЛА!»',e:'Англ. molest исторически родственно.',d:'<b>molestar</b> — беспокоить, мешать, раздражать, докучать.<br>1. Причинять неудобство или мешать кому-то.<br>2. Раздражать, действовать на нервы.<br>3. <i>¿Te molesta si…?</i> — Ты не против, если…?<div class="ex"><i>Me molesta el ruido.</i> — Меня раздражает шум.</div>'},
{id:'lago',added:'2026-06-30',ru:'озеро',es:'lago',v:'⛺ 🏞️ 🔥',m:'<b>LAGO → ЛАГерь у озера.</b> Весь ЛАГерь стоит на берегу озера.',e:'Сравни англ. lake.',d:'<b>el lago</b> — озеро; большой естественный или искусственный водоём, окружённый сушей.<div class="ex"><i>Un lago de montaña.</i> — Горное озеро.<br><i>Nadamos en el lago.</i> — Мы плавали в озере.</div>'},
{id:'bodega',added:'2026-06-30',ru:'винодельня',es:'bodega',v:'🍾 🍷 👃',m:'<b>BODEGA → BOttle + ДЕГустация.</b> Огромная bottle вина на дегустации.',e:'Англ. bodega заимствовано из испанского.',d:'<b>la bodega</b> — винодельня; винный погреб; складское помещение.<br>1. Место, где производят и выдерживают вино.<br>2. Погреб или помещение для хранения вина.<br>3. В некоторых странах — небольшой магазин.<div class="ex"><i>Visitamos una bodega.</i> — Мы посетили винодельню.</div>'},
{id:'de-hecho',added:'2026-06-30',ru:'по факту',es:'de hecho',v:'✅ 📄 🔨',m:'<b>DE HECHO → DE FACTO.</b> Две готовые конструкции со значением «по факту».',e:'Hecho также значит «факт / сделанное».',d:'<b>de hecho</b> — фактически, на самом деле, в действительности; более того.<br>Используется, чтобы подтвердить, уточнить или усилить сказанное.<div class="ex"><i>De hecho, ya lo sabía.</i> — На самом деле я уже это знал.</div>'},
{id:'entorno',added:'2026-07-07',ru:'окружение',es:'el entorno',v:'👤 🔄 🏠🌳👥',m:'<b>ENTORNO → TURN AROUND.</b> Повернулся и увидел всё своё окружение.',e:'Звуковая опора на англ. turn.',d:'<b>el entorno</b> — окружение, среда, обстановка; окружающее пространство.<br>1. Физическая среда вокруг человека или места.<br>2. Социальное окружение, круг людей.<br>3. Контекст или условия, в которых что-то происходит.<div class="ex"><i>Un entorno tranquilo.</i> — Спокойная обстановка.</div>'},
{id:'crear',added:'2026-07-07',ru:'создать',es:'crear',v:'💡 ➕ 🛠️',m:'<b>CREAR → CREATE.</b> Почти одно и то же слово.',e:'Crear и create исторически родственны.',d:'<b>crear</b> — создавать, творить, образовывать; учреждать.<br>1. Делать или производить что-то новое.<br>2. Вызывать, порождать ситуацию или эффект.<div class="ex"><i>Crear una cuenta.</i> — Создать аккаунт.<br><i>Esto crea problemas.</i> — Это создаёт проблемы.</div>'},
{id:'fijar',added:'2026-07-07',ru:'закреплять / прикреплять',es:'fijar',v:'📌 📄 🔧',m:'<b>FIJAR → FIX.</b> FIX-ишь лист булавкой к стене.',e:'Fix и fijar исторически родственны.',d:'<b>fijar</b> — закреплять, фиксировать; устанавливать, назначать; сосредоточивать.<br>1. Прикрепить что-либо так, чтобы оно не двигалось.<br>2. Установить цену, дату, время, правило.<br>3. <i>fijarse en</i> — обратить внимание на что-либо.<div class="ex"><i>Fijar una fecha.</i> — Назначить дату.</div>'},
{id:'rendirse',added:'2026-07-07',ru:'сдаваться',es:'rendirse',v:'🏳️ 🙌 😵',m:'<b>RENDIRSE → SURRENDER.</b> Белый флаг и огромная надпись SURRENDER.',e:'Звуковой мост через английское surrender.',d:'<b>rendirse</b> — сдаваться, капитулировать; уступать; прекращать сопротивление.<br>Обычно употребляется возвратно: <i>rendirse</i>.<div class="ex"><i>Me rindo.</i> — Я сдаюсь.<br><i>No te rindas.</i> — Не сдавайся.</div>'},
{id:'suelo',added:'2026-07-07',ru:'пол',es:'el suelo',v:'👞 ⬇️ 🟫',m:'<b>SUELO → SOLE.</b> Подошва — sole — касается пола.',e:'Сравни англ. soil «почва».',d:'<b>el suelo</b> — пол; земля, почва; поверхность земли.<br>1. Нижняя поверхность помещения, по которой ходят.<br>2. Земля или грунт.<div class="ex"><i>Está en el suelo.</i> — Это лежит на полу.<br><i>El suelo está mojado.</i> — Пол мокрый.</div>'},
{id:'arbusto',added:'2026-07-09',ru:'куст',es:'un arbusto',v:'🍉 🌿 🌳',m:'<b>ARBUSTO → АРБУЗ на кусте.</b> Огромный арбуз растёт прямо на кусте.',e:'Связь с «арбуз» только звуковая.',d:'<b>el arbusto</b> — куст, кустарник; многолетнее древесное растение ниже дерева, обычно с несколькими стеблями от основания.<div class="ex"><i>Un arbusto verde.</i> — Зелёный куст.</div>'},
{id:'bosque',added:'2026-07-15',ru:'лес',es:'bosque',v:'🕶️ 👔 🌲🌲',m:'<b>BOSQUE → BOSS в лесу.</b> Босс в костюме и очках гуляет между соснами.',e:'Связь с boss — мнемоника.',d:'<b>el bosque</b> — лес; большая территория, покрытая деревьями и другой растительностью.<div class="ex"><i>Caminar por el bosque.</i> — Гулять по лесу.<br><i>Un bosque de pinos.</i> — Сосновый лес.</div>'},
{id:'lo-que-sea',added:'2026-07-15',ru:'что угодно',es:'lo que sea',v:'🌊 🍕 🚲 🐘',m:'<b>LO QUE SEA → SEA со всем подряд.</b> В море плавают пицца, велосипед и слон — что угодно.',e:'Англ. sea — только звуковая ассоциация.',d:'<b>lo que sea</b> — что угодно; всё что угодно; что бы то ни было.<br>Универсальное разговорное выражение, когда конкретный выбор неважен.<div class="ex"><i>Come lo que sea.</i> — Ешь что угодно.<br><i>Lo que sea está bien.</i> — Что угодно подойдёт.</div>'},
{id:'matar',added:'2026-07-31',ru:'убить',es:'matar',v:'♟️ 👑 ☠️',m:'<b>MATAR → МАТ.</b> Поставил королю мат — король «убит».',e:'Созвучие с русским «мат» случайное.',d:'<b>matar</b> — убивать; лишать жизни; уничтожать.<br>Переносно: губить, изматывать, убивать время.<div class="ex"><i>Matar a alguien.</i> — Убить кого-то.<br><i>Me mata el calor.</i> — Жара меня убивает.</div>'},
{id:'chocarse',added:'2026-08-06',ru:'пересечься / столкнуться',es:'chocarse',v:'🚗 💥 🚙 😱',m:'<b>CHOCARSE → SHOCK + CARS.</b> Две cars столкнулись — у всех shock.',e:'Chocarse — от chocar «столкнуться».',d:'<b>chocarse</b> — столкнуться, врезаться; случайно удариться обо что-либо.<br><i>chocar con</i> — столкнуться с чем-либо/кем-либо.<br>Также переносно: вступить в конфликт, не совпасть во мнениях.<div class="ex"><i>Los coches chocaron.</i> — Машины столкнулись.</div>'},
{id:'conseguir',added:'2026-08-17',ru:'добиваться, получать',es:'conseguir',v:'🚬 🚬 🏁 🏥',m:'<b>CONSEGUIR → КОНЕЦ + СИГИ.</b> Докурил сиги до конца — <b>получил рак</b>. Неприятно, зато цепляется: conseguir = получить / добиться.',e:'Часто значит «добиться / суметь получить».',d:'<b>conseguir</b> — получать, добывать; добиваться, достигать; суметь.<br>1. Получить то, что искал или хотел.<br>2. Добиться результата, цели.<br>3. <i>conseguir + infinitivo</i> — суметь, добиться выполнения действия.<div class="ex"><i>Conseguí un trabajo.</i> — Я получил работу.<br><i>Conseguí hacerlo.</i> — Мне удалось это сделать.</div>'},
{id:'mentir',added:'2026-08-17',ru:'врать',es:'mentir',v:'🤥 🧠 💬',m:'<b>MENTIR → MENTAL.</b> Врун придумывает всё у себя в голове и врёт.',e:'Звуковая ассоциация через англ. mental.',d:'<b>mentir</b> — лгать, врать; говорить неправду намеренно.<br><i>mentir a alguien</i> — солгать кому-либо.<div class="ex"><i>No me mientas.</i> — Не ври мне.<br><i>Está mintiendo.</i> — Он/она врёт.</div>'},
{id:'anadir',added:'2026-08-17',ru:'добавлять',es:'añadir',v:'➕ 🍲 🧂',m:'<b>AÑADIR → «А, НА, ДОБАВЬ!»</b> Повар бросает ещё соли в кастрюлю.',e:'Звуковая мнемоника на «анья-дир».',d:'<b>añadir</b> — добавлять, прибавлять, присоединять; дополнять сказанное.<br>1. Добавить предмет, количество или ингредиент.<br>2. Добавить информацию или замечание.<div class="ex"><i>Añadir sal.</i> — Добавить соль.<br><i>Quiero añadir algo.</i> — Я хочу кое-что добавить.</div>'},
{id:'escapar',added:'2026-08-17',ru:'избегать / ускользать',es:'escapar',v:'🏃 💨 🚪',m:'<b>ESCAPAR → ESCAPE.</b> Нажал ESCAPE и убежал от проблемы.',e:'Escapar и escape родственны.',d:'<b>escapar / escaparse</b> — убегать, сбегать; ускользать, вырываться; избегать опасности.<br><i>escapar de</i> — сбежать/ускользнуть от чего-либо.<br>Для обычного «избегать чего-либо» часто используется <i>evitar</i>.<div class="ex"><i>Escapó de la policía.</i> — Он сбежал от полиции.</div>'},
{id:'hartarse',added:'2026-08-17',ru:'осточертеть / пресытиться',es:'hartarse',v:'😫 🍔 🚫',m:'<b>HARTARSE → «ХАРЭ!»</b> Тебе уже осточертело: «ХАРЭ, хватит!»',e:'Hartarse de algo — быть сытым по горло чем-то.',d:'<b>hartarse</b> — пресытиться; наесться досыта; быть сытым по горло, устать от чего-либо.<br><i>hartarse de algo/alguien</i> — быть по горло сытым чем-либо/кем-либо, когда что-то окончательно надоело.<div class="ex"><i>Estoy harto de esto.</i> — Мне это осточертело.<br><i>Se hartó de esperar.</i> — Ему надоело ждать.</div>'}];
let filter='all',cards=[],index=0,flipped=false;let favorites=new Set(JSON.parse(localStorage.getItem('quizspa-favorites')||'[]'));const card=document.querySelector('#card'),scene=document.querySelector('#scene'),empty=document.querySelector('#empty'),front=document.querySelector('#front'),back=document.querySelector('#back'),ru=document.querySelector('#ru'),es=document.querySelector('#es'),counter=document.querySelector('#counter'),visualFront=document.querySelector('#visualFront'),visualBack=document.querySelector('#visualBack'),mnemo=document.querySelector('#mnemo'),etym=document.querySelector('#etym'),dictText=document.querySelector('#dictText'),starFront=document.querySelector('#starFront'),starBack=document.querySelector('#starBack'),hintFront=document.querySelector('#hintFront'),hintBack=document.querySelector('#hintBack'),dictBtn=document.querySelector('#dictBtn');function isNew(x){return(new Date()-new Date(x.added+'T00:00:00'))/86400000<=NEW_DAYS}function syncStars(id){let on=favorites.has(id);[starFront,starBack].forEach(s=>{s.textContent=on?'★':'☆';s.classList.toggle('active',on)})}function clearInfo(){front.classList.remove('info-open');back.classList.remove('info-open','hint-open','dict-open');hintFront.classList.remove('active');hintBack.classList.remove('active');dictBtn.classList.remove('active')}function resetFrontInstant(){card.classList.add('no-anim');flipped=false;card.classList.remove('flipped');clearInfo();void card.offsetWidth}function finishInstantReset(){requestAnimationFrame(()=>card.classList.remove('no-anim'))}function render(){flipped=false;card.classList.remove('flipped');clearInfo();if(!cards.length){scene.style.display='none';empty.classList.add('show');empty.textContent=filter==='favorites'?'Пока нет избранных карточек. Поставь ★ на карточке.':'В этом разделе пока нет карточек.';counter.textContent='0';scene.classList.add('ready');return}scene.style.display='block';empty.classList.remove('show');let x=cards[index];ru.textContent=x.ru;es.textContent=x.es;visualFront.textContent=x.v;visualBack.textContent=x.v;mnemo.innerHTML=x.m;etym.textContent=x.e;dictText.innerHTML=x.d;syncStars(x.id);counter.textContent=(index+1)+' / '+cards.length;requestAnimationFrame(()=>scene.classList.add('ready'))}function goTo(newIndex){if(!cards.length)return;resetFrontInstant();index=newIndex;render();finishInstantReset()}function next(){goTo((index+1)%cards.length)}function prev(){goTo((index-1+cards.length)%cards.length)}function shuffle(){resetFrontInstant();for(let i=cards.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]]}index=0;render();finishInstantReset()}function applyFilter(){resetFrontInstant();cards=original.filter(x=>filter==='all'||filter==='new'&&isNew(x)||filter==='favorites'&&favorites.has(x.id));index=0;render();finishInstantReset()}function toggleFavorite(e){e.stopPropagation();if(!cards.length)return;let id=cards[index].id;favorites.has(id)?favorites.delete(id):favorites.add(id);localStorage.setItem('quizspa-favorites',JSON.stringify([...favorites]));if(filter==='favorites')applyFilter();else syncStars(id)}card.addEventListener('click',()=>{flipped=!flipped;card.classList.toggle('flipped',flipped);if(flipped){front.classList.remove('info-open');hintFront.classList.remove('active')}else{back.classList.remove('info-open','hint-open','dict-open');hintBack.classList.remove('active');dictBtn.classList.remove('active')}});starFront.addEventListener('click',toggleFavorite);starBack.addEventListener('click',toggleFavorite);hintFront.addEventListener('click',e=>{e.stopPropagation();let on=!front.classList.contains('info-open');front.classList.toggle('info-open',on);hintFront.classList.toggle('active',on)});hintBack.addEventListener('click',e=>{e.stopPropagation();let on=!back.classList.contains('hint-open');back.classList.toggle('hint-open',on);back.classList.toggle('dict-open',false);back.classList.toggle('info-open',on);hintBack.classList.toggle('active',on);dictBtn.classList.remove('active')});dictBtn.addEventListener('click',e=>{e.stopPropagation();let on=!back.classList.contains('dict-open');back.classList.toggle('dict-open',on);back.classList.toggle('hint-open',false);back.classList.toggle('info-open',on);dictBtn.classList.toggle('active',on);hintBack.classList.remove('active')});document.querySelector('#next').onclick=next;document.querySelector('#prev').onclick=prev;document.querySelector('#shuffle').onclick=shuffle;document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));applyFilter()});let sx=0,sy=0;card.addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});card.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy))dx<0?next():prev()},{passive:true});applyFilter();shuffle();
</script></body></html>
