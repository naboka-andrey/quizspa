<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Español — карточки</title><style>:root{--bg:#f5f5f5;--card:#fff;--text:#171717;--muted:#777;--border:#dedede}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;padding:22px;user-select:none}.app{width:min(92vw,620px);margin:auto}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;color:var(--muted);font-size:14px}.btn{border:1px solid var(--border);background:#fff;border-radius:12px;padding:9px 12px;font-size:15px;cursor:pointer}.scene{perspective:1000px}.card{width:100%;height:min(52vh,340px);min-height:260px;position:relative;transform-style:preserve-3d;transition:transform .35s;cursor:pointer;touch-action:pan-y}.card.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--border);border-radius:24px;box-shadow:0 12px 35px #00000014;display:flex;align-items:center;justify-content:center;padding:36px;text-align:center;font-size:clamp(30px,6vw,52px);font-weight:700;line-height:1.15}.back{transform:rotateY(180deg)}.under{display:flex;justify-content:center;margin-top:12px}.whisper{font-size:22px;width:48px;height:44px;padding:0}.hintbox{display:none;margin-top:12px;background:#fff;border:1px solid var(--border);border-radius:18px;padding:16px 18px;box-shadow:0 7px 20px #0000000a;user-select:text}.hintbox.show{display:block}.visual{text-align:center;font-size:42px;letter-spacing:5px;margin:0 0 9px}.mnemo{font-size:16px;line-height:1.42}.mnemo b{font-size:17px}.etym{border-top:1px solid #eee;margin-top:12px;padding-top:10px;color:#555;font-size:13px;line-height:1.4}.etym a{color:inherit}.smallhint{text-align:center;color:var(--muted);font-size:12px;margin-top:9px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.nav{height:58px;font-size:26px}.btn:active{transform:scale(.98)}</style></head><body><div class="app"><div class="top"><div id="counter"></div><button class="btn" id="shuffle">🔀 Shuffle</button></div><div class="scene"><div class="card" id="card"><div class="face" id="ru"></div><div class="face back" id="es"></div></div></div><div class="under"><button class="btn whisper" id="whisper" title="Подсказка">🤫</button></div><div class="hintbox" id="hintbox"><div class="visual" id="visual"></div><div class="mnemo" id="mnemo"></div><div class="etym" id="etym"></div></div><div class="smallhint">тап — переворот · 🤫 — мнемоника · свайп — следующая</div><div class="controls"><button class="btn nav" id="prev">←</button><button class="btn nav" id="next">→</button></div></div><script>
const original=[
{ru:'кричать',es:'gritar',v:'😱 🎸 🔊',m:'<b>GRITAR → guitar.</b> Представь, что ты так громко кричишь, что пытаешься перекричать гитару.',e:'От лат. <i>quiritāre</i> — громко звать/взывать. Созвучие с guitar — только мнемоника, не происхождение.',link:'https://en.wiktionary.org/wiki/gritar'},
{ru:'раздражать',es:'molestar',v:'😤 🪰 😠',m:'<b>MOLESTAR → molest / молест.</b> Кто-то постоянно тебя донимает — он тебя <i>molesta</i>. Английское “molest” похоже, но современное значение в английском другое.',e:'Из лат. <i>molestāre</i> «беспокоить», от <i>molestus</i> «обременительный, неприятный».',link:'https://en.wiktionary.org/wiki/molestar'},
{ru:'озеро',es:'lago',v:'🏞️ 🦆 💧',m:'<b>LAGO → лагуна.</b> Представь маленькую лагуну как озеро: <i>lago</i>.',e:'Из лат. <i>lacus</i> «озеро, водоём». Сравни англ. <i>lake</i> и рус. «лагуна» — родство/заимствования идут через близкие латинские формы.',link:'https://en.wiktionary.org/wiki/lago#Spanish'},
{ru:'винодельня',es:'bodega',v:'🍇 🍷 🏚️',m:'<b>BODEGA.</b> Бочка вина стоит в “бодеге” — слово уже встречается и в английском <i>bodega</i>.',e:'Испанское <i>bodega</i> пришло через лат. <i>apothēca</i> от греч. «хранилище». Англ. <i>bodega</i> заимствовано из испанского.',link:'https://en.wiktionary.org/wiki/bodega'},
{ru:'по факту',es:'de hecho',v:'📌 ✅ 📄',m:'<b>HECHO = сделанное / факт.</b> <i>De hecho</i> буквально связано с тем, что “сделано”: отсюда «на деле, фактически».',e:'<i>Hecho</i> — причастие от <i>hacer</i> «делать» и существительное «факт». Полезная внутрииспанская связь: hacer → hecho → de hecho.',link:'https://en.wiktionary.org/wiki/hecho#Spanish'},
{ru:'окружение',es:'el entorno',v:'👤 🌳 🏠 👥',m:'<b>EN-TORNO → вокруг.</b> Ты стоишь в центре, а всё <i>en torno</i> тебя — твоё окружение.',e:'Связано с <i>torno</i> «оборот, круг; токарный станок» и выражением <i>en torno</i> «вокруг».',link:'https://en.wiktionary.org/wiki/entorno'},
{ru:'создать',es:'crear',v:'💡 ✨ 🛠️',m:'<b>CREAR → create.</b> Почти прямое совпадение с английским <i>create</i>: создать.',e:'Из лат. <i>creāre</i>. Исп. <i>crear</i> и англ. <i>create</i> восходят к одному латинскому корню.',link:'https://en.wiktionary.org/wiki/crear'},
{ru:'закреплять / прикреплять',es:'fijar',v:'📌 📄 🧱',m:'<b>FIJAR → fijo.</b> Если что-то <i>fijo</i> — оно фиксированное. <i>Fijar</i> = сделать его фиксированным, закрепить.',e:'Внутрииспанская связка: <i>fijo</i> «фиксированный» → <i>fijar</i> «фиксировать, закреплять». Сравни рус. «фиксировать» и англ. <i>fix</i>.',link:'https://en.wiktionary.org/wiki/fijar'},
{ru:'сдаваться',es:'rendirse',v:'🏳️ 🙌 😮‍💨',m:'<b>RENDIRSE → render.</b> Представь: ты “сдал” работу/оружие и поднял белый флаг. <i>Me rindo!</i> — «Я сдаюсь!»',e:'Возвратная форма <i>rendirse</i> от <i>rendir</i> «сдавать, подчинять; приносить результат». Англ. <i>render</i> — дальний родственник через лат./франц. историю.',link:'https://en.wiktionary.org/wiki/rendirse'},
{ru:'пол',es:'el suelo',v:'👟 ⬇️ 🟫',m:'<b>SUELO → sole.</b> Подошва (<i>sole</i>) касается пола/земли — <i>suelo</i>.',e:'Из лат. <i>solum</i> «почва, основание». Сравни англ. <i>soil</i> — исторически связанное слово.',link:'https://en.wiktionary.org/wiki/suelo'},
{ru:'куст',es:'un arbusto',v:'🌿 🌳 ✂️',m:'<b>ARBUSTO → arboretum.</b> Всё “arb-” представляем зелёным и древесным: <i>arbusto</i> — куст.',e:'Из лат. <i>arbustum</i> «место, засаженное деревьями/кустарником». Сравни <i>árbol</i> «дерево» и англ. <i>arboretum</i>.',link:'https://en.wiktionary.org/wiki/arbusto'},
{ru:'лес',es:'bosque',v:'🌲 🌲 🌲',m:'<b>BOSQUE → Боско в лесу.</b> Вообрази человека по имени Боско, который потерялся среди деревьев.',e:'Происхождение слова связывают с германским корнем, ср. итал. <i>bosco</i> и франц. <i>bois</i>. “Боско” здесь только мнемоника.',link:'https://en.wiktionary.org/wiki/bosque'},
{ru:'что угодно',es:'lo que sea',v:'🎲 🍕 🚲 🐘',m:'<b>SEA = “пусть будет”.</b> <i>Lo que sea</i> — буквально идея «что бы это ни было» → что угодно.',e:'<i>Sea</i> — форма сослагательного наклонения глагола <i>ser</i> «быть». Полезная связь: ser → sea → lo que sea.',link:'https://en.wiktionary.org/wiki/sea#Spanish'},
{ru:'убить',es:'matar',v:'♟️ 👑 💥',m:'<b>MATAR → МАТ.</b> Поставил королю мат — “убил” его. <i>Matar</i> = убить.',e:'Созвучие с русским «мат» — мнемоника, не этимология. Испанское <i>matar</i> — старое иберо-романское слово; точное происхождение спорно.',link:'https://en.wiktionary.org/wiki/matar#Spanish'},
{ru:'пересечься / столкнуться',es:'chocarse',v:'🚗 💥 🚙',m:'<b>CHOCARSE → shock.</b> Машины столкнулись — у всех шок. <i>Chocar(se)</i> = столкнуться.',e:'<i>Chocarse</i> — возвратная форма от <i>chocar</i> «сталкиваться, ударяться». Англ. <i>shock</i> очень удобно для памяти; историческая связь сложнее простого прямого заимствования.',link:'https://en.wiktionary.org/wiki/chocar'}];
let cards=[...original],index=0,flipped=false;const card=document.querySelector('#card'),ru=document.querySelector('#ru'),es=document.querySelector('#es'),counter=document.querySelector('#counter'),box=document.querySelector('#hintbox'),visual=document.querySelector('#visual'),mnemo=document.querySelector('#mnemo'),etym=document.querySelector('#etym');
function render(){flipped=false;card.classList.remove('flipped');box.classList.remove('show');let x=cards[index];ru.textContent=x.ru;es.textContent=x.es;visual.textContent=x.v;mnemo.innerHTML=x.m;etym.innerHTML=x.e+' <a href="'+x.link+'" target="_blank" rel="noopener">↗ источник</a>';counter.textContent=(index+1)+' / '+cards.length}function next(){index=(index+1)%cards.length;render()}function prev(){index=(index-1+cards.length)%cards.length;render()}function shuffle(){for(let i=cards.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]]}index=0;render()}card.onclick=()=>{flipped=!flipped;card.classList.toggle('flipped',flipped)};document.querySelector('#whisper').onclick=()=>box.classList.toggle('show');document.querySelector('#next').onclick=next;document.querySelector('#prev').onclick=prev;document.querySelector('#shuffle').onclick=shuffle;document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev();if(e.key===' '||e.key==='Enter'){e.preventDefault();card.click()}});let sx=0,sy=0;card.addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});card.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy))dx<0?next():prev()},{passive:true});shuffle();
</script></body></html>
