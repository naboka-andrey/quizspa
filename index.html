utton id="pr">←</button><button id="nx">→</button></div></div><script>
const A=[
['gritar','2026-06-30','кричать','gritar','gritar — кричать, орать.',['😱🎸🔊|GRITAR → GUITAR. Гитарист орёт так громко, что перекрикивает GUITAR.','🐯📢😱|ГРИВА + ТАР: лев с огромной гривой орёт в рупор.','🎸🔥🗯️|Гитара загорелась и буквально кричит — GRITAR.','👹🎤🔊|Монстр ГРИ-ТАР орёт в микрофон, лопаются окна.','🦍🎸📣|Горилла с GUITAR соревнуется с собственным криком.']],
['molestar','2026-06-30','раздражать','molestar','molestar — мешать, раздражать.',['🦋👕😤|MOLESTAR → МОЛЬ ДОСТАЛА. Моль снова съела футболку: «МОЛЬ, ты ДОСТАЛА!»','🐹⭐😡|MOLESTAR → MOLE + STAR. Крот-звезда (MOLE STAR) всю ночь поёт под окном и ужасно раздражает.','👮‍♂️🚧😤|MOLESTAR → molest в английском: навязчиво приставать/докучать — кто-то постоянно мешает тебе пройти.','🧪👃🤢|MOLESTAR → МОЛ + ЭСТЕР. На химии моль вещества и вонючий ester так раздражают нос, что хочется уйти.','📱🔔😖|MOLESTAR → «мол, эй, стар!» Старик каждые десять секунд пишет «эй!» — невозможно не раздражаться.']],
['lago','2026-06-30','озеро','lago','el lago — озеро.',['⛺🏞️🔥|LAGO → ЛАГерь. Огромный ЛАГЕРЬ разбит прямо на берегу озера: палатки, костёр и вода.','🎮🏞️🧱|LAGO → ЛАГ. Озеро в игре страшно ЛАГает: волны зависли в воздухе кубиками.','🐸🏞️🪵|LAGO → ЛЯГУшка. Гигантская ЛЯГУшка занимает всё озеро и прыгает между берегами.','🚂🏞️😱|LAGO → ЛАГ + О. Поезд из-за ЛАГА остановился буквой О вокруг целого озера.','🐕🌊🏃|LAGO → «ЛА, ГО!» Собаке ЛА кричат GO, и она с разбега прыгает прямо в озеро.']],
['bodega','2026-06-30','винодельня','bodega','la bodega — винодельня; винный погреб.',['🍷🏠🇬🇧|BODEGA → английское BODEGA: винный погреб/магазин. Та же BODEGA, забитая вином.','🍾🍷👃|BOttle + ДЕГустация: бутылка размером с дом на винодельне.','🛢️🍷💪|BODEGA → БОДЯ + ДЕГустация. БОДЯ ныряет в винную бочку прямо во время ДЕГустации.','🍷🐂👃|BODEGA → БОДЯ + ДЕГустация. Бык БОДЯ профессионально дегустирует вино на винодельне.','🍾👤🍷|BODEGA → БОДЯ + ДЕГА. БОДЯ с другом ДЕГОЙ давят виноград ногами на винодельне.']],
['de-hecho','2026-06-30','по факту','de hecho','de hecho — фактически, на самом деле.',['✅📄🔨|HECHO = факт/сделанное. DE HECHO — буквально «по факту», на самом деле.','⚖️📄✅|DE HECHO → DE FACTO: два штампа «ПО ФАКТУ» на документе.','🛠️✅📌|HECHO связано с HACER = делать: дело уже СДЕЛАНО, значит это свершившийся факт — DE HECHO.','🔨🧾💥|HECHO = сделанное. На стол кладут уже СДЕЛАННОЕ доказательство: вот факт, DE HECHO.','📰🔍✅|Газета врёт, детектор отвечает DE HECHO — «на самом деле».']],
['entorno','2026-07-07','окружение','el entorno','el entorno — окружение, среда.',['👤🔄🏠🌳👥|ENTORNO → TURN AROUND. Повернись — всё вокруг и есть окружение.','🌍🔁👀|EN-TORNO → TURN: крутишься и видишь окружение.','👤🔄🏠🌳|ENTORNO → TURN. Ты делаешь полный TURN и видишь всё своё окружение вокруг.','🌀👤🏙️|ENTORNO → TURN: гигантский TURN-торнадо закручивает всё окружение вокруг тебя.','🔄👨‍👩‍👧‍👦🏡|TURN камеры показывает весь ENTORNO вокруг.']],
['crear','2026-07-07','создать','crear','crear — создавать.',['💡🛠️✨|CREAR → CREATE. Почти то же слово и то же значение: создать.','👑🎨✨|CREAR → CREATOR. Creator создаёт мир.','🖱️➕🌍|Кнопка CREATE превращается в CREAR и создаёт планету.','🧙‍♂️💥🏰|CREAR → CREATE. Волшебник нажимает CREATE — из пустоты возникает замок.','🧱🤲✨|CREAR → CREATOR. CREATOR руками создаёт дом кирпич за кирпичом.']],
['fijar','2026-07-07','закреплять / прикреплять','fijar','fijar — закреплять, фиксировать.',['📌🔧🔒|FIJAR → FIX / фиксировать. FIX-ишь лист — закрепляешь его.','📅🔩🔒|FIJAR дату: календарь прикрутили болтом.','🧴📌🧱|FIJAR → FIX. Суперклей с надписью FIX намертво закрепляет предмет к стене.','🛠️📌💥|Мастер ФИХАР стреляет гвоздями и закрепляет предметы.','🧲📄🧱|FIJAR → FIX. Огромный магнит FIX фиксирует лист на металлической стене.']],
['rendirse','2026-07-07','сдаваться','rendirse','rendirse — сдаваться.',['🏳️🙌📉|RENDIRSE ← RENDIR. «Отдать себя/уступить» — поднять руки и сдаться.','🏳️🥊😮‍💨|Боксёр РЕНДИ выбрасывает белое полотенце — RENDIRSE.','🥊🏳️😮‍💨|RENDIRSE → РЕНДИ. Боксёр РЕНДИ выбрасывает белое полотенце и сдаётся.','🪖🙌🏳️|РЕНДИ-СЭ: солдат РЕНДИ складывает оружие и поднимает белый флаг — сдаться.','🏳️👑🗣️|Король РЕНДИ кричит «СДАЮСЬ!» — RENDIRSE.']],
['suelo','2026-07-07','пол','el suelo','el suelo — пол; земля.',['👞🌍⬇️|SUELO ↔ SOIL. Оба связаны с землёй: подошва стоит на SUELO, на почве/полу.','👞⬇️🟫|SUELO → SOLE: подошва sole касается пола.','🥿⬇️🏠|SOLE обуви всегда смотрит на SUELO.','👞🕳️⬇️|SUELO → SOLE. Подошва SOLE пробивает пол и проваливается вниз.','🧼👞🟫|SUELO → SOLE. Уборщик натирает пол до блеска, и подошва SOLE отражается как в зеркале.']],
['arbusto','2026-07-09','куст','un arbusto','el arbusto — куст.',['🍉🌿💥|ARBUSTO → АРБУЗ. На маленьком кусте растёт нелепо огромный АРБУЗ и ломает ветки.','🚌🌿😱|ARBUSTO → AR + BUS. Огромный BUS застрял в кусте, ветки торчат из окон.','💪🌿⬆️|ARBUSTO → BUST. Куст делает мощный BUST, раздувая ветки как грудь бодибилдера.','🌿👤🚌|ARBUSTO → АР + БУС + ТО. Артур толкает BUS прямо в куст: АР-БУС-ТО.','🍉🚌🌳|АРБУЗ + BUS: автобус везёт гигантский АРБУЗ и врезается в куст — ARBU-STO.']],
['bosque','2026-07-15','лес','bosque','el bosque — лес.',['👔🌲😱|BOSQUE → BOSS. Строгий BOSS в костюме заблудился в густом лесу.','📦🌲🌲|BOSQUE → BOX. В лесу вместо деревьев стоят гигантские BOX-коробки.','🐂🌲👣|BOSQUE → БОС + КЕ. БОСой человек убегает от быка сквозь лес.','🏀🌲🇺🇸|BOSQUE → BOS-ton. Баскетболист из BOS-ton забросил мяч, а тот улетел в лес.','👑🌳🤫|BOSQUE → BOSS + «ке». BOSS леса командует деревьями: «Ке, тихо!»']],
['lo-que-sea','2026-07-15','что угодно','lo que sea','lo que sea — что угодно.',['❓🌊🎁|LO QUE SEA: SEA здесь форма SER — «что бы это ни БЫЛО» = что угодно.','🌊🍕🚲🐘|SEA со всем подряд: в море пицца, велосипед и слон — что угодно.','🎁❓🎲|Коробка LO QUE SEA: внутри может быть что угодно.','🧞‍♂️✨❓|Джинн спрашивает «Что хочешь?» — LO QUE SEA.','🛒🌍🎁|Тележка LO QUE SEA везёт весь мир.']],
['matar','2026-07-31','убить','matar','matar — убивать.',['♟️👑☠️|MATAR → МАТ. Поставил королю мат — король «убит».','👑♟️🗡️|Шахматный МАТ превращается в настоящий меч: MATAR.','🥋💥☠️|МАТ + удар: после финального MATAR противник падает.','☠️🧹😱|МАТЬ кричит «МАТАР!» и прихлопывает таракана.','♟️💀🎮|MATAR → МАТ. В игре после шахматного МАТА персонаж буквально падает замертво.']],
['chocarse','2026-08-06','пересечься / столкнуться','chocarse','chocarse — столкнуться, врезаться.',['😱🚗💥|CHOCARSE → SHOCK. Столкнулся — получил SHOCK. Звук и смысл рядом.','🚗💥🚙|SHOCK + CARS: две cars столкнулись — у всех shock.','🍫🚗💥|CHOCO + CARS: шоколадные машины сталкиваются.','🚙🤝🚗💥|Две CARS решили «пересечься» и врезались.','🍫🚘🧱|Шоколадная CAR врезается в стену: CHO-CAR-SE.']],
['conseguir','2026-08-17','добиваться, получать','conseguir','conseguir — получать, добиваться.',['🚬🏁🏥|CONSEGUIR → КОНЕЦ СИГИ. Докурил сигу до конца — ПОЛУЧИЛ рак.','🧭🏆✅|CONSEGUIR ↔ CONSEQUENCE по началу звучания: прошёл цепочку действий до CONSEQUENCE и получил результат/добился цели.','🦊🎯🏆|CONSEGUIR → «КОНЬ + СЕГИР». Конь упорно следует (seguir) к финишу и ДОБИВАЕТСЯ кубка.','🔑📦🙌|CONSEGUIR → GET по смыслу. После длинного квеста наконец GET ключ и ПОЛУЧАЕШЬ сундук.','👣🎯🏁|Внутри CONSEGUIR слышится SEGUIR = следовать. Следуешь к цели до конца — ДОБИВАЕШЬСЯ её.']],
['mentir','2026-08-17','врать','mentir','mentir — врать.',['🤥🧠💬|MENTIR → MENTAL. Врун всё выдумывает в голове.','👮🤥📄|МЕНТ врёт в протоколе — МЕНТ-ИР.','👮🎭💬|MENTIR → МЕНТ. МЕНТ надевает маску и врёт на допросе.','🤥👔🎤|МЕНТ по имени ИР врёт в микрофон.','🧠🤥💬|MENTIR → MENTAL. Всё сказанное существует только MENTAL, в голове: значит врёт.']],
['anadir','2026-08-17','добавлять','añadir','añadir — добавлять.',['👧➕🎁|AÑADIR → АНЯ + ДАР. АНЯ ДАРит ещё один подарок и ДОБАВЛЯЕТ его к огромной куче.','➕🍲🧂|«А, НА, ДОБАВЬ!» — повар добавляет соль.','➕📦🤲|АНЯ ДАРит ещё одну коробку — добавляет её к куче.','🧂👩‍🍳➕|Аня добавляет ингредиент за ингредиентом.','➕🧩👧|АНЯ вставляет дополнительную деталь в пазл.']],
['escapar','2026-08-17','избегать / ускользать','escapar','escapar — убегать, ускользать.',['🏃💨⌨️|ESCAPAR → ESCAPE. Почти одно слово и тот же смысл: сбежать/ускользнуть.','🚪🏃💨|ESCAPE-дверь открылась — ты сбежал.','🐭🪤🏃|Мышь нажала ESC и ускользнула из ловушки.','🎮👾🚪|В игре кнопка ESCAPAR — моментальный побег.','⌨️🏃🚓|ESCAPAR → ESCAPE/ESC. Нажал огромную ESC — и буквально сбежал от полиции.']],
['hartarse','2026-08-17','осточертеть / пресытиться','hartarse','hartarse — быть сытым по горло, пресытиться.',['😫✋🚫|HARTARSE → «ХАРЭ!» Начальник в сотый раз повторяет одно и то же, и ты взрываешься: «ХАРЭ!» — осточертело.','❤️🍑🤢|HARTARSE → HEART + ARSE. Сердце (HEART) уже в заднице (ARSE): всё, предел, ты сыт по горло.','🍽️🤢⬆️|HARTARSE связано с HARTO = пресыщенный. Представь человека, объевшегося так, что еда уже «по горло».','🎨😵🚫|HARTARSE → АРТ + АРСЕ. Художника заставили сотый раз переделывать один и тот же ART — его окончательно достало.','🐻🍯🤮|HARTARSE → ХАРТ + «сыт». Огромный медведь ХАРТ съел бочку мёда и больше видеть её не может — пресытился.']],
['dejar-resena','2026-09-12','оставить отзыв','dejar la reseña','dejar la reseña — оставить отзыв.',['⭐📝🇬🇧|RESEÑA ≈ REVIEW, DEJAR = оставить. Оставляешь REVIEW — DEJAR LA RESEÑA.','📱⭐👋|Нажал 5 звёзд, написал RESEÑA и оставил её.','🚪⭐📝|Дежурный у двери просит: «Оставь рецензию!»','🍽️📝⭐|После ресторана оставляешь RESEÑA.','🧾✍️🚶|Пишешь RESEÑA на чеке и оставляешь его.']],
['propina','2026-09-12','чаевые','la propina','la propina — чаевые.',['💶📌🧾|PROPINA → ПРИПИНАть деньги к счёту. Припнул пару евро — чаевые.','💶🍽️🙏|«ПРО ПИНА»: официант Пина получил деньги — чаевые.','🪙👨‍🍳📌|Монетку припинают к счёту — PROPINA.','💶🍕👩|Официантка Пропина получает купюру поверх счёта.','🪙🤏🍽️|Монетка «про Пина» остаётся официанту.']],
